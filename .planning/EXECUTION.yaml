# Serial executor protocol:
# - implementation is authorized only when plan_state is frozen AND root STATUS phase is implementation;
# - while root phase is planning, all allocated nodes remain pending and no executor starts code;
# - the user then starts a numbered executor chat, e.g. "אני צאט 1 תתחיל";
# - that chat reads only its assigned node IDs, their TREE dependencies, and referenced contracts;
# - before starting any node, every dependency must already be state: done;
# - same-chat dependencies are satisfied by completing earlier listed nodes first;
# - a node becomes done only after its TREE success_evidence is verified.
