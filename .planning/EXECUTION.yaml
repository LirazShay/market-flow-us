# If blocked because the frozen plan itself is materially wrong/incomplete:
# - set .planning/STATUS.yaml -> plan_state: active and root STATUS.yaml -> phase: planning;
# - stop starting new execution work;
# - replan/review the smallest affected S&T area;
# - preserve done nodes only if still valid;
# - re-freeze and repair only affected execution entries.
#
# result:
# - null while pending/in_progress
# - short verification/result reference when done
# - short blocker explanation when blocked

