    note: "A legacy donor Fake Market file still contains MapHeat/GetSecuritiesData and market-scope.runtime.js naming. It is not part of the reviewed U.S. local acceptance route; classify/remove or retain-with-evidence during the repository-wide A7 stale-path sweep."
  - id: "A8-CANDIDATE-001"
    area: "docs/LIVE_VERIFICATION.md / TREE 7.4"
