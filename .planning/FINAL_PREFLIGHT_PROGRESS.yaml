findings:
  - id: "A1-001"
    severity: HIGH
    area: "browser/provider/us-screener.js"
    finding: "Provider fetch/JSON could stall indefinitely."
    fix: "Added a 10-second AbortController/Promise.race hard bound."
    regression: "tests/unit/final-preflight-a1.test.mjs"
    state: fixed
  - id: "A1-002"
    severity: HIGH
    area: "browser/runtime/producer-bridge.js + browser/runtime/application.js"
    finding: "Stop rejection/partial launch could leave live producer authority."
    fix: "Stop fails closed and launch failure drains/stops Recorder plus partial producer session."
    regression: "tests/unit/final-preflight-a1.test.mjs"
    state: fixed
  - id: "A1-003"
    severity: MEDIUM
    area: "browser runtime/support diagnostics"
    finding: "Reviewed diagnostics still exposed MarketScope branding."
    fix: "Rebranded public diagnostics/producer identity to Market Flow US."
    regression: "branding/diagnostic suites"
    state: fixed
  - id: "A2-001"
    severity: HIGH
    area: "browser/recorder/recorder.js -> failed-cycle authority"
    finding: "Raw provider/network error text crossed Browser-to-Node and could be persisted."
    fix: "Only fixed phase-specific sanitized descriptors cross authority; raw error remains browser-local."
    regression: "tests/unit/final-preflight-a2.test.mjs + recorder-scheduling.test.mjs"
    state: fixed
  - id: "A2-002"
    severity: HIGH
    area: "local-service/database/writer.js"
    finding: "ROLLBACK flushed pending Appender work first, so flush failure could prevent rollback."
    fix: "ROLLBACK discards pending non-authoritative buffers and executes directly."
    regression: "tests/unit/database-writer.test.mjs + U.S. F1-F5 rollback suite"
    state: fixed
  - id: "A3-001"
    severity: HIGH
    area: "local-service/reads/viewer-reads.js"
    finding: "viewer.status could re-emit arbitrary legacy persisted error text."
    fix: "Status exposes only allowlisted safe descriptors or one generic sanitized descriptor."
    regression: "tests/service/final-preflight-a3.test.mjs + viewer-reads.test.mjs"
    state: fixed
  - id: "A3-002"
    severity: MEDIUM
    area: "browser/viewer/client.js"
    finding: "Concurrent Viewer requests could record another request's diagnostic ID."
    fix: "Each request captures and propagates its exact requestId."
    regression: "tests/unit/viewer-client.test.mjs"
    state: fixed
  - id: "A3-003"
    severity: MEDIUM
    area: "browser/viewer/client.js"
    finding: "Viewer defaults/errors still used MarketScope branding."
    fix: "Rebranded Viewer identity and service messages."
    regression: "viewer-client/branding suites"
    state: fixed
  - id: "A3-004"
    severity: MEDIUM
    area: "browser/viewer/detail-surface.js"
    finding: "Refresh could supersede loadMore while leaving loadingMore locked true."
    fix: "Authoritative refresh releases stale pagination ownership; stale pages remain ignored."
    regression: "tests/unit/detail-surface.test.mjs"
    state: fixed
  - id: "A4-001"
    severity: HIGH
    area: "Windows launchers"
    finding: "Node 24 was enforced only at setup time."
    fix: "All post-setup launchers run a shared Node-24 preflight before product work."
    regression: "tests/unit/final-preflight-a4.test.mjs"
    state: fixed
  - id: "A4-002"
    severity: MEDIUM
    area: "START_DEMO.cmd"
    finding: "Browser opener could attach to an older process already serving port 4173."
