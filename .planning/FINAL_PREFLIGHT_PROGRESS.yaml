findings:
  - id: "A1-001"
    severity: HIGH
    area: "browser/provider/us-screener.js"
    finding: "Provider fetch/JSON had no hard failure bound; a stalled provider request could leave Recorder cycleInFlight true and make runtime stop/relaunch wait indefinitely."
    fix: "Added a 10-second provider request hard bound using AbortController plus Promise.race so acquisition/parse cannot block authority lifecycle indefinitely."
    regression: "tests/unit/final-preflight-a1.test.mjs bounds a never-settling fetch."
    state: "fixed; A1 CI green"

  - id: "A1-002"
    severity: HIGH
    area: "browser/runtime/producer-bridge.js + browser/runtime/application.js"
    finding: "producer.session.stop rejection re-armed heartbeat, and a launch failure after session start did not close the partial producer session; either path could leave a live producer while runtime state was error and make relaunch conflict with ownership."
    fix: "stopSession now fails closed and tears down transport; launch failure drains/stops Recorder and closes any already-started producer session before remaining in error."
    regression: "tests/unit/final-preflight-a1.test.mjs covers both stop rejection and partial-launch cleanup."
    state: "fixed; A1 CI green"

  - id: "A1-003"
    severity: MEDIUM
    area: "browser/runtime/producer-bridge.js + browser/diagnostics/support-snapshot.js"
    finding: "Several user-visible browser diagnostic/error strings still identified the local service as MarketScope after release branding cutover."
    fix: "Changed reviewed A1 producer/support diagnostic strings and default producer client identity to Market Flow US."
    regression: "Existing branding/diagnostic suites plus A1 Fast/Browser verification; repeat integrated proof at A9."
    state: "fixed; A1 CI green"

  - id: "A2-001"
    severity: HIGH
    area: "browser/recorder/recorder.js -> producer.cycle.failed -> local authority"
    finding: "Failed-cycle reports copied the raw provider/network Error.name and Error.message across the Browser-to-Node boundary, where they could be persisted in cycles.error_json and sessions.last_error_json. A provider error containing private/session material could therefore cross the public-safe boundary."
    fix: "Recorder now keeps the raw error only in local latestError state and emits a fixed phase-specific sanitized descriptor through onFailure/ProducerBridge."
    regression: "tests/unit/final-preflight-a2.test.mjs injects cookie/account/authorization sentinels and proves none cross the failure-report boundary; recorder-scheduling.test.mjs proves raw local debugging state remains available."
    state: "fixed; A2 CI green"

  - id: "A2-002"
    severity: HIGH
    area: "local-service/database/writer.js"
    finding: "The bulk writer flushed buffered history/latest work before executing ROLLBACK. If the Appender/flush itself was the failing persistence operation, rollback could fail before DuckDB received ROLLBACK, leaving the serialized writer connection in a poisoned transaction."
    fix: "ROLLBACK now discards all non-authoritative bulk buffers/set-wise-copy state and executes directly on the underlying DuckDB connection without attempting a flush first."
    regression: "tests/unit/database-writer.test.mjs proves buffered rows are discarded and proves ROLLBACK still reaches the underlying connection even when createAppender would throw; existing U.S. F1-F5 transaction regressions remain green."
    state: "fixed; A2 CI green"

  - id: "A3-001"
    severity: HIGH
    area: "local-service/reads/viewer-reads.js"
    finding: "viewer.status re-emitted the stored last_error_json name/message. Databases produced before A2 hardening could therefore expose arbitrary legacy provider/network error text even though new failed-cycle writes are sanitized."
    fix: "Trusted status reads now treat persisted failure JSON only as an error-presence signal and return a fixed public-safe collection error descriptor."
    regression: "tests/service/final-preflight-a3.test.mjs injects legacy persisted cookie/account/authorization sentinels and proves none are returned; viewer-reads.test.mjs now asserts the generic descriptor."
    state: "fixed; A3 CI green"

  - id: "A3-002"
    severity: MEDIUM
    area: "browser/viewer/client.js"
    finding: "Viewer request diagnostics derived operationId from the global requestSequence after await. Concurrent requests completing out of order could therefore record another request's ID and mis-correlate the diagnostic trail."
    fix: "sendRequest now returns the exact requestId together with the response; each request records diagnostics using its own captured requestId."
    regression: "tests/unit/viewer-client.test.mjs completes concurrent Viewer requests out of order and proves exact diagnostic operationId correlation."
    state: "fixed; A3 CI green"

  - id: "A3-003"
    severity: MEDIUM
    area: "browser/viewer/client.js"
    finding: "Reviewed Viewer client defaults and user-visible connection/error strings still used MarketScope after the Market Flow US branding cutover."
    fix: "Rebranded the default Viewer client identity plus local-service connection/correlation/readiness messages to Market Flow US."
    regression: "viewer-client.test.mjs plus full Fast/Browser branding verification."
    state: "fixed; A3 CI green"

  - id: "A3-004"
    severity: MEDIUM
    area: "browser/viewer/detail-surface.js"
    finding: "If History loadMore was in flight when an authoritative Detail refresh started, refresh superseded the old generation but left loadingMore true. The stale request could not clear it, leaving pagination disabled until Detail was reopened."
    fix: "Authoritative Detail refresh explicitly releases stale pagination ownership before starting the new generation; stale continuation responses remain unable to mutate refreshed rows."
    regression: "tests/unit/detail-surface.test.mjs proves refresh clears loadingMore while the superseded continuation is unresolved and that the stale page is ignored when it later completes."
    state: "fixed; A3 CI green"

reviewed_non_findings:
  - id: "A2-REVIEW-001"
    area: "schema-v3 bootstrap/reopen/rejection"
    note: "Fresh schema-v3 exact columns/hardening, reopen with saved queries and stale-session recovery, and rejection of old MarketScope v1/v2 databases without mutation are already mechanically covered and remained green. No additional defect found."
  - id: "A2-REVIEW-002"
    area: "U.S. producer config boundary"
    note: "The generic bridge/persistence retains legacy compatibility seams, but the production U.S. composition passes the marked createUsRecorderConfig object; JSON wire and persisted session config are cadence-only. The real bridge/service regression confirms {snapshotIntervalMs} only, so no release-path defect was recorded."
  - id: "A2-REVIEW-003"
    area: "producer loss/stale heartbeat/service restart"
    note: "Existing real-service recovery proofs cover producer socket loss, stale heartbeat ownership release, clean service shutdown and restart recovery; all remained green after A2 changes."
  - id: "A3-REVIEW-001"
    area: "Current/Security/History authority"
    note: "Schema-v3 projection, display-name fallback, historical-only lookup, zero/null preservation, 500-row keyset ordering and cursor-to-security binding are covered by real-service tests and remained green."
  - id: "A3-REVIEW-002"
    area: "Scanner admission and saved-query authority"
    note: "Scanner still enforces one prepared SELECT, zero parameters and dynamic/side-effect-function rejection on the hardened Scanner connection. Saved-query CRUD is serialized/durable and its selected/draft/active-generation separation remained green. No SQL was materially changed in A3, so the AGENTS static-SQL re-entry rule was not triggered."
  - id: "A3-REVIEW-003"
    area: "Scanner query/result bounds"
    note: "No arbitrary result-row cap was added: PRODUCT_SPEC requires exact Scanner result rows, while inbound requests are already bounded by the 16 MiB WebSocket max payload. Scanner runs on a separate hardened connection and executions are serialized/non-overlapping. Adding an implicit LIMIT would silently change user-authored SELECT semantics and is not justified by the frozen contract."

