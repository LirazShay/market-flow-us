    regression: "tests/unit/final-preflight-a4.test.mjs"
    state: fixed
  - id: "A5-001"
    severity: HIGH
    area: "local acceptance subprocesses"
    finding: "Hung children could leave FR-7/8/9 unbounded."
    fix: "Added hard timeouts and process-tree cleanup."
