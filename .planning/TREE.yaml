  '4.5':
    status: approved
    strategy: A Demo Buy observation can be turned into a reproducible local AI Investigation Pack that supports strategy improvement without hindsight leakage or automatic AI control.
    tactic: Build a deterministic Node evidence exporter, then expose generation/copy/regeneration controls from Demo Buy.
    parallel_assumptions:
    - The useful AI boundary is evidence packaging and disciplined prompting, not automatic cloud integration.
    - Persisted history, Demo Buy provenance and bounded Scanner context contain the necessary local evidence.
    necessary_assumptions:
    - Outcome inspection alone does not systematically explain why the query ranked a candidate or what pre-buy evidence might improve SQL.
    sufficiency_assumptions:
    - Exporter plus UI workflow make the forensic evidence usable while preserving human control and local privacy.
    success_evidence:
    - Pack contains exact SQL, bounded original Scanner context, 30-minute pre-buy history, exact baseline, 10-minute post-buy history, trusted horizon outcomes, manifest, field guide and anti-hindsight prompt.
    - No AI API/key/cloud dependency or automatic SQL mutation is introduced.
