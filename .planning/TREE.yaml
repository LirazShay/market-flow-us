    sufficiency_assumptions: []
    success_evidence:
    - Controls require exactly one recognized identity column; invalid rows are never silently included.
    - Selected/All/Top-X choose source rows before dedupe, preserve original ranks, enforce 5000 bound and reset selection on new generation.
    - Generation snapshot includes exact SQL/timing/rowCount and bounded first-50 context under 4.3.1 limits.
    - One shared capture slot prevents double-submit/unbounded queues; busy auto generations are visibly skipped.
    - Confirmed commit/reject vs acknowledgement-unknown states are distinguishable and Scanner scheduling continues.
    depends_on:
