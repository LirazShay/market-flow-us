  '4':
    status: approved
    strategy: Scanner remains the editable strategy surface; Demo Buy validates short-horizon outcomes and AI Investigation exports bounded, anti-hindsight forensic evidence for improving Scanner SQL.
    tactic: Preserve Scanner, add Demo Buy backend and UX, then add a local deterministic AI Investigation Pack exporter and UI workflow.
    parallel_assumptions:
    - Scanner SQL remains strategy authority; no Strategy Engine is introduced.
    - Demo Buy persists facts and derives outcomes directly from existing history.
    - AI Investigation is a local evidence export, not an AI agent or automatic query editor.
    necessary_assumptions:
    - The product now requires candidate selection, outcome validation and disciplined post-outcome strategy investigation.
    sufficiency_assumptions:
    - Scanner + Demo Buy + AI Investigation jointly cover the requested strategy-learning loop without real execution or Phase-2 liquidity modeling.
    success_evidence:
    - Existing Scanner behavior remains green.
    - Schema v4 preserves exact Demo Buy and bounded original Scanner-context provenance.
    - Demo Buy Viewer shows all required horizons and failure states.
    - AI Investigation Pack reproduces query/context/pre-buy/baseline/post-buy/outcome evidence with anti-hindsight instructions and no cloud dependency.
