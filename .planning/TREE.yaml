  "4":
    status: approved
    strategy: Scanner remains editable strategy authority; Demo Buy validates short-horizon outcomes and AI Investigation exports bounded anti-hindsight evidence for improving Scanner SQL.
    tactic: Preserve Scanner, add Demo Buy backend/UX, then add deterministic local AI Investigation export/UX.
    parallel_assumptions:
      - No Strategy Engine or direct broker execution is introduced inside this analytical branch.
      - Demo Buy derives outcomes from existing history; AI Investigation packages evidence rather than becoming authority.
    necessary_assumptions:
      - Candidate selection, outcome validation and disciplined post-outcome investigation are all required by the current scope.
    sufficiency_assumptions:
      - 4.1–4.5 cover the full strategy-learning loop without Phase-2 liquidity/fillability.
    success_evidence:
      - Existing Scanner behavior remains green.
      - Schema v4 preserves minimum Demo Buy facts and bounded original Scanner context.
      - Demo Buy Viewer exposes trustworthy progressive outcomes.
      - AI pack reproduces exact query provenance and sharing-safe context/market evidence with anti-hindsight rules, neutral returned-position semantics and no cloud dependency.
    depends_on: []
    children: ["4.1", "4.2", "4.3", "4.4", "4.5"]

