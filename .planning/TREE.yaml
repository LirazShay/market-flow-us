  "4.3.1":
    status: approved
    strategy: Schema v4 durably stores minimum Demo Buy facts plus bounded original Scanner comparison provenance and safely upgrades valid v3 U.S. databases.
    tactic: Add demo_buy_captures/demo_buy_items, bounded source_result_context_json, transactional v3→v4 migration/fresh-v4 bootstrap, restart behavior and v3-or-v4 new-day rotation.
    parallel_assumptions:
      - Baseline/future market facts remain in history.
      - Scanner context is provenance only, never market authority.
    necessary_assumptions:
      - Capture, AI investigation and restart cannot be trustworthy without explicit schema lifecycle ownership.
    sufficiency_assumptions: []
    success_evidence:
      - Fresh DB boots schema v4 with exact Demo Buy columns/constraints.
      - Valid v3→v4 preserves market authority and scanner_saved_queries; partial-v3-with-Demo-structures fails closed; injected migration failure leaves v3 usable.
      - Context preserves first 50 source rows, canonical identity column always, at most 64 retained columns, 128-byte textual/serialized-cell bound, deterministic truncation/omission metadata and at most 256 KiB serialized JSON.
      - Persisted context is local forensic provenance and is not treated as automatically shareable; AI export owns a separate sharing-safe projection.
      - Restart preserves active-day captures/context.
      - New-day accepts valid v3 or v4, preserves saved queries, archives source unchanged if requested, and creates fresh v4 with empty Demo Buy tables.
      - No speculative history index is added without representative workload evidence.
    depends_on: ["2.3"]
    children: []

  "4.3.2":
    status: approved
    strategy: A Demo Buy capture records exact selected candidates, immutable Scanner provenance/context and the authoritative baseline visible at its serialized writer point.
    tactic: Add demo.buy.capture validation/client-service protocol and same-writer all-or-nothing persistence; browser submits ordered deduped {securityId,resultRank} plus bounded generation context.
    parallel_assumptions:
      - Writer ordering defines virtual-buy authority relative to market commits; wall-clock timestamps are diagnostics only.
    necessary_assumptions:
      - Schema alone does not define race behavior, baseline linkage, provenance integrity, capture bounds or acknowledgement semantics.
    sufficiency_assumptions: []
    success_evidence:
      - Protocol/unit tests reject malformed/duplicate/out-of-range items, invalid mode/bounds, oversized SQL/context and context-to-item position/identity mismatch.
      - Real-service tests prove all-or-nothing capture, original returned result position, immutable query/timing/context provenance, monotonic capture IDs and exact buy_cycle_id linkage.
      - captured_at_ms is assigned inside serialized writer work after prior socket/writer work; buy_cycle_id is the item authority watermark.
      - Wall-clock anomalies preserve raw timestamps and produce nullable derived timing + bounded anomaly diagnostics rather than changing authority or rejecting an otherwise valid capture.
      - Lost transport acknowledgement after dispatch is ACKNOWLEDGEMENT_UNKNOWN, never confirmed rejection, with no blind automatic retry.
      - Capture stores no user-supplied/copied buy Price and does not mutate market authority.
    depends_on: ["4.3.1"]
    children: []

  "4.3.3":
    status: approved
    strategy: One authoritative Node read model answers what happened after each virtual buy at all required horizons and can refresh either a page or one observation.
    tactic: Add demo.buy.page, demo.buy.observation.get and demo.buy.capture.get using the same set-wise evaluator, exact baseline join, post-watermark first-at/after matching and bounded keyset paging.
    parallel_assumptions: []
    necessary_assumptions:
      - Persisted capture facts do not answer the outcome question until later history is resolved and calculated.
      - Long-running Auto capture requires targeted refresh so an older observation remains inspectable even after it leaves page one.
    sufficiency_assumptions: []
    success_evidence:
      - New/materially changed evaluation SQL passes mandatory static preflight before first execution.
      - Fixtures prove target=captured_at_ms+horizon and future row requires cycle_id > buy_cycle_id plus collected_at_ms >= target, with deterministic time/cycle tie-break.
      - Null/zero/unavailable-reason semantics, delayed observations and baseline-integrity failure are proven.
      - demo.buy.page and demo.buy.observation.get reuse identical evaluator semantics; targeted refresh updates one item without resetting list pagination.
      - Page ordering is capture_id DESC then result_rank ASC with fixed 50-item opaque keyset paging and stable continuation while newer captures arrive.
      - Each page is produced from one transactionally consistent DuckDB read snapshot; no N×10 browser/read loop.
      - Capture SQL detail is loaded on demand through demo.buy.capture.get.
      - Representative active-day timing is measured; no precompute/index/background updater is added absent evidence.
    depends_on: ["4.3.1"]
    children: []

  "4.4":
    status: approved
    strategy: The user can create Demo Buys from Scanner and inspect progressive outcomes without hidden background behavior or losing the observation being investigated.
    tactic: Separate Scanner capture/Auto controls from a capture-grouped Demo Buy outcome surface with targeted refresh and explicit recovery states.
    parallel_assumptions: []
