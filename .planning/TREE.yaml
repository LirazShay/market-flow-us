  4.5.1:
    status: approved
    strategy: Node can deterministically generate a safe local AI Investigation Pack for one captured security.
    tactic: Add demo.buy.ai-pack.create that validates capture membership, reads persisted provenance/context/history/evaluator output, and atomically writes a controlled export directory.
    parallel_assumptions:
    - The existing trusted evaluator is reused for OUTCOME.json rather than duplicated.
    necessary_assumptions:
    - A prompt alone is insufficient without reproducible evidence files and strict time boundaries.
    sufficiency_assumptions: []
    success_evidence:
    - Unit/service tests prove fixed 30-minute pre-buy and 10-minute post-buy windows, exact baseline, partial/complete outcome classification and targetInScannerContext flag.
    - SCANNER_CONTEXT preserves first-50 order/ranks/truncation metadata; rank>50 targets remain investigable but peer/rank claims are explicitly limited.
    - PROMPT enforces prediction-time vs outcome separation, fact/derived/hypothesis labeling, KISS SQL proposals and multi-observation validation.
    - Generated bundle has README/PROMPT/MANIFEST/QUERY/SCANNER_CONTEXT/TARGET_BEFORE/BASELINE/TARGET_AFTER/OUTCOME/FIELD_GUIDE.
    - Safe generated paths only; no browser output path, credentials/session data or raw authenticated dumps.
    - Temp-dir + atomic rename prevents partial final packs; failure leaves no misleading complete bundle and mutates no DB.
    - Regeneration is deterministic except generation metadata and changes only evidence that legitimately became available.
    depends_on:
    - 4.3.2
    - 4.3.3
    children: []
  4.5.2:
    status: approved
    strategy: The Demo Buy UI lets the user generate, inspect, copy and regenerate AI Investigation Packs without leaving the local product workflow.
    tactic: Add per-observation Generate AI Investigation Pack, partial/complete status, local export path, Copy AI Prompt and Regenerate controls using demo.buy.ai-pack.create.
    parallel_assumptions: []
    necessary_assumptions:
    - A backend exporter is not useful if the user cannot invoke it from the observation being investigated.
    sufficiency_assumptions: []
    success_evidence:
    - UI shows target identity/rank and PARTIAL_OUTCOME vs COMPLETE_OUTCOME before/after generation.
    - Generate returns the local folder and Copy AI Prompt copies the generated prompt; Regenerate refreshes outcome-dependent evidence.
    - Pack generation failure is visible and does not alter Scanner/Demo Buy authority or scheduling.
    - Chromium E2E proves a failed rank-1 candidate investigation end-to-end, file presence/content boundaries, prompt copy and regeneration.
    - No automatic AI call or SQL activation exists.
    depends_on:
    - 4.5.1
    - 4.4.2
    - '5.2'
    children: []
