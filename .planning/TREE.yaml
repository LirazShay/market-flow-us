  '0':
    status: approved
    strategy: Market Flow US is a complete, locally runnable and verifiable U.S.-market analysis product that preserves the proven MarketScope operating model, replaces only Israel-specific provider/data assumptions, validates Scanner-selected candidates over short future horizons, and can export disciplined local evidence for AI-assisted strategy investigation before any real order execution exists.
    tactic: 'Complete seven necessary capability branches: U.S. acquisition, U.S. data authority, trusted reads/surfaces, Scanner + Demo Buy + AI investigation, deterministic offline proof, operational verification infrastructure, and staged release/target-machine acceptance.'
    parallel_assumptions:
    - Preserving proven MarketScope mechanisms is lower-risk than reconstructing them.
    - Strategy-specific candidate selection remains editable Scanner SQL; Demo Buy and AI investigation are evidence/analysis layers, not order execution.
    necessary_assumptions: []
    sufficiency_assumptions:
    - Provider acquisition alone is insufficient without persistence, reads, Scanner, Demo Buy, forensic export, deterministic proof and release evidence.
    - The seven branches jointly cover the requested product while excluding real order execution, portfolio logic and Phase-2 liquidity/sellability analysis.
    success_evidence:
    - Every implementation-ready leaf is completed with its stated evidence.
    - Current, Detail/History, Scanner, Demo Buy and AI Investigation operate over the final schema-v4 authority.
    - Node owns Demo Buy evaluation and AI evidence-pack construction; the browser does not recreate authority semantics.
    - Fast, Browser, Planning and bounded Workload verification are green on the final post-feature candidate.
    - Target-machine/local/provider acceptance passes on the exact final candidate with no blocking defect.
    depends_on: []
    children:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
  '1':
    status: approved
    strategy: The browser repeatedly acquires one exact complete U.S. screener snapshot and shapes it into the existing producer-cycle contract.
    tactic: Use ScreenerHulPaging3 with exact response validation and canonical PaperId membership; preserve Recorder lifecycle and one-segment cycle semantics.
    parallel_assumptions:
    - The proven one-request U.S. screener response contains current membership and row data.
    necessary_assumptions:
    - No downstream authority can be correct without exact U.S. acquisition.
    sufficiency_assumptions:
    - Provider validation plus Recorder/universe integration is sufficient for the acquisition boundary.
    success_evidence:
    - Provider/Recorder proof covers completeness, identity, membership changes, non-overlap and fail-closed behavior.
    depends_on: []
    children:
    - '1.1'
    - '1.2'
