  "0":
    status: approved
    strategy: Market Flow US is a complete local U.S.-market product that preserves the proven analysis/validation model, keeps the isolated permission-gated IBKR order sidecar, supports an explicitly user-confirmed in-product BUY integration, and keeps Market Recording + Replay isolated from live authority.
    tactic: Complete nine necessary capability branches covering acquisition, market authority, trusted reads, Scanner/Demo Buy/AI investigation, deterministic offline proof, operational tooling, release/target-machine acceptance, standalone IBKR execution plus the narrow Detail BUY integration, and Market Recording + Replay plus adversarial hardening.
    parallel_assumptions:
      - Preserve proven mechanisms unless current evidence requires change.
      - Scanner SQL remains strategy authority; Demo Buy and AI Investigation remain evidence layers.
      - IBKR execution remains a separate local boundary; in-product BUY consumes it through a trusted Node-owned seam and never exposes the sidecar credential to browser code.
      - Replay remains an external producer/orchestrator over the normal producer/service path rather than a server mode.
    necessary_assumptions: []
    sufficiency_assumptions:
      - All nine branches remain sufficient because Replay hardening extends branch 9 and the first in-product BUY extends branch 8 rather than creating new capability branches.
    success_evidence:
      - Every implementation leaf satisfies its success evidence.
      - Current, Detail/History, Scanner, Demo Buy and AI Investigation operate over final schema-v4 market authority.
      - Standalone IBKR BUY/SELL lifecycle remains deterministically proven with authenticated localhost caller protection, public-safe diagnostics and restart-safe idempotency.
      - The first in-product BUY is Detail-only, explicit, quantity-configured, MKT/DAY and uses a trusted local confirmation boundary without browser-visible sidecar credentials or automatic execution.
      - Market Recording + Replay is adversarially hardened after its completed implementation, with no known material untested Replay risk before final target-machine acceptance.
      - Fast, Browser, Planning, required order/replay and bounded Workload gates are green on the final post-hardening/post-BUY candidate without turning Replay waits into ordinary-suite cost.
      - Final target-machine/provider acceptance passes on that exact candidate, with actual live IBKR submission either proven when permission exists or recorded exactly as PENDING_EXTERNAL_PERMISSION.
    depends_on: []
    children: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

