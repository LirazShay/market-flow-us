  "0":
    status: approved
    strategy: Market Flow US is a complete local U.S.-market analysis product that preserves the proven operating model, validates Scanner candidates with Demo Buy, and exports disciplined local evidence for AI-assisted query improvement before real order execution exists.
    tactic: Complete seven necessary capability branches covering acquisition, authority, trusted reads, Scanner/Demo Buy/AI investigation, deterministic offline proof, operational tooling, and release/target-machine acceptance.
    parallel_assumptions:
      - Preserve proven mechanisms unless current evidence requires change.
      - Scanner SQL remains strategy authority; Demo Buy and AI Investigation are evidence layers.
    necessary_assumptions: []
    sufficiency_assumptions:
      - All seven branches are required to deliver a usable and verifiable product without adding real execution or Phase-2 liquidity analysis.
    success_evidence:
      - Every implementation leaf satisfies its success evidence.
      - Current, Detail/History, Scanner, Demo Buy and AI Investigation operate over final schema-v4 authority.
      - Fast, Browser, Planning and bounded Workload gates are green on the post-feature candidate.
      - Final target-machine/provider acceptance passes on that exact candidate.
    depends_on: []
    children: ["1", "2", "3", "4", "5", "6", "7"]

