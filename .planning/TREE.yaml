version: 1
root: "0"

nodes:
  "0":
    status: approved
    strategy: "MarketScope is a clean, independently understandable, locally runnable and verifiable market-analysis product whose Browser, Node/DuckDB authority, Current, Detail/History and Scanner work together from this repository alone."
    tactic: "Implement the product through seven necessary capability branches: runtime foundation, authoritative ingestion, trusted reads, Viewer surfaces, Scanner, canonical offline verification/demo, and scale/live/release closure."
    parallel_assumptions:
      - "The completed Product, Data, Technical and Test contracts remove the material design uncertainty needed for implementation decomposition."
      - "A compact causal tree can cover the detailed MASTER_COVERAGE without mirroring every granular obligation as a leaf."
    necessary_assumptions: []
    sufficiency_assumptions:
      - "All seven capability branches are jointly required: buildability, authority, reads, user surfaces, Scanner, deterministic offline proof, and release evidence."
      - "Each implementation leaf includes its own proof; verification is not postponed to one final testing phase."
    success_evidence:
      - "Every implementation-ready leaf is completed with its success evidence."
      - "Current, Detail/History, Scanner and diagnostics satisfy PRODUCT_SPEC.md against one Node/DuckDB authority."
      - "Fake Market demo, Fast CI and Browser CI are green on the final candidate."
      - "Representative workload evidence exists and no unresolved correctness/performance blocker remains."
      - "The bounded live-provider gate is PASS, or only genuine external market/session execution is explicitly pending while the harness and all offline proof are complete."
      - "Final repository/handoff documentation matches implemented truth and normal future work no longer requires Market Flow."
    depends_on: []
    children: ["1", "2", "3", "4", "5", "6", "7"]

  "1":
    status: approved
    strategy: "MarketScope has one minimal buildable runtime foundation on which every product capability can be implemented and tested consistently."
    tactic: "Create the root package/build layout, protocol contract, hardened DuckDB/service bootstrap, WebSocket role boundary and reusable unit/service test harness."
    parallel_assumptions:
      - "One root npm project with Node 24, native ESM, esbuild, ws and @duckdb/node-api is sufficient for this local product."
    necessary_assumptions:
      - "Without a stable common runtime foundation, later Browser, Node and verification work would invent incompatible assumptions."
    sufficiency_assumptions:
      - "Build, protocol, database, transport and test-harness leaves together provide the common executable substrate for all later branches."
    success_evidence:
      - "Fresh checkout installs pinned dependencies, builds the normal browser runtime, boots schema-v1 DuckDB, accepts valid role handshakes and can run isolated real-service tests."
    depends_on: []
    children: ["1.1", "1.2", "1.3", "1.4", "1.5"]

  "1.1":
    status: approved
    strategy: "The repository has one deterministic package/build/run foundation for Browser and Node code."
    tactic: "Create the agreed source layout, root package/lockfile, Node-24 engine contract, esbuild browser bundle/bookmarklet pipeline and initial run/test scripts without adding product frameworks."
    parallel_assumptions:
      - "esbuild can emit both normal runtime and launcher from one browser source graph."
    necessary_assumptions:
      - "All later leaves require reproducible package/build artifacts and paths."
    sufficiency_assumptions: []
    success_evidence:
      - "npm ci succeeds on Node 24 using the committed lockfile."
      - "npm run build:browser emits the normal self-contained runtime and bookmarklet artifact from one source graph."
      - "Build tests prove the bookmarklet begins with javascript:, is one line, avoids whole-runtime percent encoding, and has no arbitrary absolute size ceiling."
      - "Generated/local DB artifacts are ignored and no React/ORM/Express/Nest/workspace/Docker layer is introduced."
    depends_on: []
    children: []

  "1.2":
    status: approved
    strategy: "Browser and Node share one exact protocol-v1 contract with deterministic validation and safe error shaping."
    tactic: "Implement the small shared envelope, operation validators, role permissions, success/error shapes and stable error codes from TECHNICAL_SPEC.md."
    parallel_assumptions:
      - "The finite operation set is small enough for explicit validators and does not need a generic RPC framework."
    necessary_assumptions:
      - "Every producer/viewer/scanner interaction depends on one shared validated message contract."
    sufficiency_assumptions: []
    success_evidence:
      - "Unit tests cover version/type/requestId/payload validation and every operation payload boundary."
      - "Unknown messages, role violations and unsafe error details are rejected exactly as specified."
    depends_on: ["1.1"]
    children: []

  "1.3":
    status: approved
    strategy: "The localhost service owns one hardened native DuckDB with deterministic schema-v1 startup, reopen and shutdown behavior."
    tactic: "Implement configuration parsing, DuckDB hardening, the six-table schema, writer/viewer/scanner connections, schema-version validation and startup/shutdown resource lifecycle."
    parallel_assumptions:
      - "One DuckDB instance with a small fixed connection set is sufficient for the single-user authority model."
    necessary_assumptions:
      - "Persistence, reads and Scanner execution all require a valid database lifecycle first."
    sufficiency_assumptions: []
    success_evidence:
      - "Real-DuckDB tests prove fresh bootstrap, reopen, required tables, unsupported-version fail-closed behavior and hardening settings."
      - "Startup marks stale running sessions interrupted before readiness; graceful shutdown reopens cleanly."
    depends_on: ["1.1"]
    children: []

  "1.4":
    status: approved
    strategy: "The loopback service exposes a minimal secure WebSocket transport with one producer and multiple viewers."
    tactic: "Implement node:http upgrade handling plus ws, exact Origin allowlist, max payload, hello-first role binding, producer exclusivity, viewer multiplicity and sanitized protocol errors."
    parallel_assumptions:
      - "Native browser WebSocket plus ws is sufficient without Express or a generalized transport layer."
    necessary_assumptions:
      - "All Browser→Node behavior requires an explicit role-aware transport boundary."
    sufficiency_assumptions: []
    success_evidence:
      - "Real-socket tests prove allowed/missing/wrong Origin, hello-first enforcement, malformed/oversized rejection and request correlation."
      - "Exactly one producer is accepted, a second is explicitly rejected, and multiple viewers remain usable."
    depends_on: ["1.2", "1.3"]
    children: []

  "1.5":
    status: approved
    strategy: "Implementation leaves can prove service behavior cheaply against real sockets and real temporary DuckDB."
    tactic: "Create node:test-based unit/service utilities for isolated temp DBs, ephemeral service ports, real ws clients, durable-state inspection and construction-time persistence fault injection."
    parallel_assumptions:
      - "Node's built-in test runner is sufficient outside browser E2E and avoids Jest/Vitest ceremony."
    necessary_assumptions:
      - "Atomic persistence and recovery work needs reusable real-service proof infrastructure rather than mocks."
    sufficiency_assumptions: []
    success_evidence:
      - "Tests can start/stop isolated real services with real temporary DuckDB files and ws clients."
      - "Fault hooks are unavailable through production protocol and parallel tests cannot share DB paths/ports accidentally."
    depends_on: ["1.4"]
    children: []

  "2":
    status: approved
    strategy: "Only exact validated provider cycles become durable MarketScope authority, with failures unable to corrupt prior committed state."
    tactic: "Adapt proven provider/Recorder logic into the Browser runtime, then connect it through producer protocol to transactional universe/cycle/session persistence and fail-closed recovery."
    parallel_assumptions:
      - "The extracted V1 pure acquisition/validation behavior can be reused or adapted without carrying IndexedDB authority."
    necessary_assumptions:
      - "Without authoritative ingestion, every read/UI/Scanner surface would operate on incomplete or untrusted data."
    sufficiency_assumptions:
      - "Provider validation, Recorder scheduling, session/universe persistence, atomic cycle commit, Browser protocol bridging and heartbeat/recovery together cover the complete producer path."
    success_evidence:
      - "A complete validated universe and cycle travel Browser→Node and advance latest/history only after COMMIT ACK."
      - "Malformed/incomplete provider data, commit failure and transport loss leave prior authority intact."
    depends_on: []
    children: ["2.1", "2.2", "2.3", "2.4", "2.5", "2.6"]

  "2.1":
    status: approved
    strategy: "The Browser converts provider responses into validated provider-neutral universe/chunk/cycle facts without losing raw fidelity."
    tactic: "Port/adapt the proven pure universe, chunk and cycle logic plus thin same-origin MapHeat2/GetSecuritiesData adapters according to DATA_CONTRACT.md."
    parallel_assumptions:
      - "The extracted V1 pure logic already covers the required identity/completeness invariants."
    necessary_assumptions:
      - "No Recorder schedule or Node commit can be trusted until provider identity, membership, timing and raw-value semantics are enforced."
    sufficiency_assumptions: []
    success_evidence:
      - "Unit tests prove PaperId/Key canonicalization, dynamic universe count, response-order independence and exact requested/received/unique/missing/duplicate/unexpected validation."
      - "Raw null/zero/empty/missing values are preserved and CompleteCycle/ValidatedUniverse match DATA_CONTRACT.md with no Node IDs/auth secrets."
    depends_on: ["1.1"]
    children: []

  "2.2":
    status: approved
    strategy: "Browser collection executes complete provider cycles sequentially without overlap or catch-up corruption."
    tactic: "Implement chunk sequencing, timing capture, Recorder scheduling and universe-refresh ordering around the pure provider logic, with one cycle and one chunk request active at a time."
    parallel_assumptions:
      - "The proven sequential baseline is sufficient until workload/live evidence justifies concurrency."
    necessary_assumptions:
      - "Pure validation alone does not produce the continuous complete-cycle stream required by the product."
    sufficiency_assumptions: []
    success_evidence:
      - "Unit tests prove sequential chunks, delay only between chunks, no trailing delay, immediate first cycle, no overlapping cycles and no catch-up burst."
      - "Provider failure stops the affected cycle immediately without fabricating success."
    depends_on: ["2.1"]
    children: []

  "2.3":
    status: approved
    strategy: "Node owns producer session state and an atomically acknowledged durable universe revision."
    tactic: "Implement producer.session.start/stop, heartbeat persistence primitives and producer.universe.replace with revalidation, all-seen metadata retention, current-membership revisioning and commit-before-ACK."
    parallel_assumptions:
      - "Separating universe revision from cycle payload keeps transport small while preserving membership causality."
    necessary_assumptions:
      - "Cycle commits require an active Node-owned session and a known acknowledged universe revision."
    sufficiency_assumptions: []
    success_evidence:
      - "Real-service tests prove session lifecycle, sanitized config persistence, atomic revisioned universe replacement and inactive metadata retention."
      - "Invalid universe and U1..U3 fault injection roll back with no revision ACK."
    depends_on: ["1.5"]
    children: []

  "2.4":
    status: approved
    strategy: "A successful complete cycle advances cycles/history/latest/session atomically, while a failed cycle records diagnostics without changing market authority."
    tactic: "Implement the one-writer complete-cycle and failed-cycle transactions, Node cycle ID allocation, raw+typed history projection, whole-latest replacement and ACK-after-COMMIT behavior."
    parallel_assumptions:
      - "Whole-latest replacement matches the complete-universe invariant and one serialized writer makes MAX(cycle_id)+1 deterministic."
    necessary_assumptions:
      - "Trustworthy Current/history requires one atomic persistence boundary."
    sufficiency_assumptions: []
    success_evidence:
      - "Real-service tests prove valid commit updates cycles/history/latest/session and ACKs only after COMMIT."
      - "F1..F5 fault injection proves rollback leaves prior latest/history/session completion state unchanged."
      - "UniverseRevision/membership/raw-identity mismatches are rejected; failed-cycle persistence never touches latest/history."
      - "History grows exactly with successful cycles and no automatic retention/cleanup silently deletes committed production history."
    depends_on: ["2.3"]
    children: []

  "2.5":
    status: approved
    strategy: "The Browser producer bridges Recorder output to Node authority and exposes success only after durable acknowledgements."
    tactic: "Implement Browser hello/session/universe/cycle/failure/stop protocol flow, commit ACK handling and metadata-only commit hints."
    parallel_assumptions:
      - "Separating provider acquisition from persistence transport preserves the intended authority boundary."
    necessary_assumptions:
      - "Recorder output and Node transactions do not form a working product until Browser success/failure state is tied to Node ACKs."
    sufficiency_assumptions: []
    success_evidence:
      - "Integration tests prove universe ACK precedes cycles for that revision and cycle success is not exposed before commit ACK."
      - "Commit hint contains no market rows and is emitted only after successful commit."
      - "No credential/cookie/auth/account data enters protocol payloads or logs."
    depends_on: ["2.2", "2.4"]
    children: []

  "2.6":
    status: approved
    strategy: "Producer ownership fails closed on heartbeat/service/transport loss and restarts without misreporting stale sessions."
    tactic: "Implement heartbeat cadence/stale handling, socket-loss interruption, pending-request failure, Browser stop-on-disconnect, startup stale-session recovery and explicit relaunch semantics."
    parallel_assumptions:
      - "Explicit recovery is sufficient for v1 and avoids reconnect/offline-queue/replay complexity."
    necessary_assumptions:
      - "Without failure ownership, dead transport/stale producer state could falsely appear authoritative."
    sufficiency_assumptions: []
    success_evidence:
      - "Real-service tests prove heartbeat update, stale timeout, producer release and interrupted sessions."
      - "Browser integration proves disconnect fails pending authority work and stops collection rather than queueing offline cycles."
      - "Restart preserves committed data and no stale session remains RUNNING."
    depends_on: ["2.5"]
    children: []

  "3":
    status: approved
    strategy: "Browser consumers can retrieve all trusted current, diagnostic and historical data through narrow Node read operations."
    tactic: "Implement current/status, security/history and one browser viewer client over committed DuckDB authority with deterministic pagination and historical-only support."
    parallel_assumptions:
      - "A small set of purpose-built reads is sufficient and avoids a generic RPC data layer."
    necessary_assumptions:
      - "Current/Detail cannot be correct if browser views still depend on provider calls or direct database access."
    sufficiency_assumptions:
      - "Current/status, security/history and one viewer client cover all non-Scanner browser consumption."
    success_evidence:
      - "Read operations return PRODUCT_SPEC logical shapes from committed Node/DuckDB state only."
      - "Historical-only security and 500-row deterministic continuation work without provider access."
    depends_on: []
    children: ["3.1", "3.2", "3.3"]

  "3.1":
    status: approved
    strategy: "Current rows and operational status are derived only from committed authority with the required health semantics."
    tactic: "Implement viewer.current.get and viewer.status.get from latest LEFT JOIN universe plus session/cycle/history aggregates."
    parallel_assumptions:
      - "The extracted Current/diagnostics contract maps directly to existing authority tables without another cache."
    necessary_assumptions:
      - "Current UI and diagnostics require trusted Node reads before rendering can be migrated."
    sufficiency_assumptions: []
    success_evidence:
      - "Real-service tests prove latest-derived rows, metadata enrichment/no-drop behavior, summary counters and zero-vs-missing diagnostics."
      - "Health precedence UNKNOWN/RUNNING/STALE/STOPPED/ERROR matches PRODUCT_SPEC."
    depends_on: ["2.6"]
    children: []

  "3.2":
    status: approved
    strategy: "One canonical SecurityId resolves to current metadata and deterministic persisted history, including historical-only securities."
    tactic: "Implement viewer.security.get and viewer.history.page with current/universe/history existence resolution, 500-row keyset pagination and opaque validated cursor."
    parallel_assumptions:
      - "ORDER BY collected_at_ms DESC, cycle_id DESC provides deterministic continuation across equal timestamps."
    necessary_assumptions:
      - "Detail/History requires a read contract independent of Current-row presence and IndexedDB cursor mechanics."
    sufficiency_assumptions: []
    success_evidence:
      - "Real-service tests prove current, historical-only and unknown SecurityId distinctions."
      - "500/501/equal-timestamp tests prove no duplicate/skip and invalid/wrong-security cursors fail."
    depends_on: ["2.4"]
    children: []

  "3.3":
    status: approved
    strategy: "Browser Viewer code has one reusable client for trusted Node reads without owning authority."
    tactic: "Implement viewer-role request helpers for Current, status, security, history and Scanner routing, with request correlation and explicit unavailable/error states."
    parallel_assumptions:
      - "A thin client centralizes transport/error handling without becoming a second data layer."
    necessary_assumptions:
      - "UI leaves should consume one stable read client rather than duplicate WebSocket plumbing."
    sufficiency_assumptions: []
    success_evidence:
      - "Unit/browser-focused tests prove request correlation, sanitized errors and service-unavailable handling."
      - "The client never treats cached rows as durable authority and never calls provider endpoints."
    depends_on: ["3.1", "3.2"]
    children: []

  "4":
    status: approved
    strategy: "Users can operate the complete Browser product shell and inspect Current and Security Detail/History with the exact extracted behavior while all authority comes from Node."
    tactic: "Rebuild the Viewer surfaces around the trusted client, preserve state/accessibility/refresh contracts, and compose producer, Viewer and Scanner into one idempotent browser runtime."
    parallel_assumptions:
      - "Most extracted V1 pure display/state behavior can be adapted without preserving IndexedDB authority."
    necessary_assumptions:
      - "Trusted reads alone do not satisfy the required user-facing analytical views."
    sufficiency_assumptions:
      - "Current/diagnostics, Detail/History, refresh/state preservation and final browser-runtime composition together cover the Browser product shell."
    success_evidence:
      - "Chromium against Fake Market proves one normal runtime composes producer, Current, Detail/History and Scanner without duplicate in-page producers or Viewer provider calls."
    depends_on: []
    children: ["4.1", "4.2", "4.3", "4.4"]

  "4.1":
    status: approved
    strategy: "Current Universe and operational diagnostics preserve the extracted product contract on Node data."
    tactic: "Implement Current model/render/sort/format/accessibility plus the diagnostics strip using trusted Current/status reads."
    parallel_assumptions:
      - "Extracted V1 pure logic can be retained/adapted while replacing data-source wording and storage assumptions."
    necessary_assumptions:
      - "Current is a first-class product surface and the primary Detail entry."
    sufficiency_assumptions: []
    success_evidence:
      - "Unit tests prove exact 16-column shape, default/toggled deterministic sort, tie-breakers and missing/zero formatting."
      - "Chromium proves loading/populated/empty/error states, diagnostics visibility and click/Enter/Space accessibility."
    depends_on: ["3.3"]
    children: []

  "4.2":
    status: approved
    strategy: "Security Detail/History preserves exact pagination, historical-only and Back behavior on Node reads."
    tactic: "Implement Detail loading/summary/history table, 500-row Load More/retry, historical-only presentation, not-found handling and shared Back-to-Current state capture."
    parallel_assumptions:
      - "The Node cursor can replace IndexedDB mechanics without changing observable guarantees."
    necessary_assumptions:
      - "Current alone cannot provide persisted per-security analysis or historical-only continuity."
    sufficiency_assumptions: []
    success_evidence:
      - "Unit/Chromium tests prove exact 15-column history shape, initial 500, Load More, retryable continuation failure and unknown-vs-empty distinctions."
      - "Historical-only Detail never fabricates current summary from newest history."
    depends_on: ["4.1"]
    children: []

  "4.3":
    status: approved
    strategy: "Viewer refresh keeps UI context while always rereading trusted committed state."
    tactic: "Wire manual refresh and metadata-only commit hints to authoritative Current/status/Detail/history rereads, preserving sort, viewport, Detail identity and loaded history depth."
    parallel_assumptions:
      - "Notification-as-hint plus reread makes lost notifications harmless."
    necessary_assumptions:
      - "Static views do not satisfy continuous market use or the extracted state-preservation contract."
    sufficiency_assumptions: []
    success_evidence:
      - "Chromium proves manual refresh makes no provider call, live hints refresh committed values and lost hints recover manually."
      - "Current sort/viewport survive Current→Detail→refresh→Back and loaded history depth survives a new committed cycle."
    depends_on: ["4.2"]
    children: []

  "4.4":
    status: approved
    strategy: "The normal browser runtime composes collection, trusted Viewer surfaces and Scanner into one idempotent provider-page product entry."
    tactic: "Implement the runtime bootstrap/shell that starts or reuses the in-page producer, opens/reuses the same-origin Viewer, wires Current/Detail/Scanner surfaces, and shuts down/relaunches explicitly on service or page lifecycle changes."
    parallel_assumptions:
      - "A thin composition/bootstrap layer is sufficient; product capabilities remain owned by their existing modules rather than duplicated in an application framework."
    necessary_assumptions:
      - "Individual producer and UI leaves do not by themselves implement the user flow that starts the daily product runtime and composes all surfaces."
    sufficiency_assumptions: []
    success_evidence:
      - "Focused browser tests prove the built runtime starts the producer flow, opens/reuses one Viewer shell and exposes Current, Detail/History and Scanner through the same product entry."
      - "Repeated launch in one provider page does not create a second in-page producer."
      - "Service-unavailable and explicit relaunch behavior uses the existing fail-closed producer/client semantics rather than an offline queue."
      - "Closing Viewer windows does not stop the producer; reopening Viewer state works from Node authority even when the producer is stopped."
      - "Clean stop/relaunch waits for Node stop acknowledgement/ownership release and never creates overlapping producer ownership."
    depends_on: ["4.3", "5.3"]
    children: []

  "5":
    status: approved
    strategy: "Users can repeatedly execute broad analytical read-only SQL, preserve reusable named query configurations, start from verified examples and create new queries from durable AI-friendly guidance without Scanner mutating market authority."
    tactic: "Combine hardened Node Scanner execution with durable schema-v2 saved-query CRUD, Browser library/built-ins/Draft-Active isolation, shared SecurityId navigation, and one schema-synchronized Scanner SQL guide."
    parallel_assumptions:
      - "DuckDB parser/statement/function metadata plus instance hardening can support the required analytical SQL without a custom SQL parser."
      - "One same-DuckDB configuration table is sufficient for durable single-user saved queries without introducing another persistence engine."
    necessary_assumptions:
      - "Scanner is a required first-class product surface and cannot be replaced by fixed Viewer queries."
      - "Reusable named queries and accurate SQL guidance are necessary for practical ongoing Scanner use rather than one-off hand-authored SQL."
    sufficiency_assumptions:
      - "Node admission/execution, durable saved-query CRUD, browser library/built-ins, Detail navigation and synchronized AI documentation jointly satisfy the expanded Scanner contract."
    success_evidence:
      - "Allowed analytical SQL works with exact result order/columns and rejected SQL cannot mutate authority."
      - "Schema-v1 data migrates transactionally to v2; named user-query CRUD persists across restart without changing market-authority facts."
      - "Browser scheduling proves immediate activation, no overlap/no catch-up, saved-query selection changes Draft only, and built-ins are immutable/copyable."
      - "Every built-in executes against current Scanner authority and automated schema/example checks keep the canonical AI SQL guide complete."
    depends_on: []
    children: ["5.1", "5.2", "5.3", "5.4", "5.5", "5.6"]

  "5.1":
    status: approved
    strategy: "Node executes only admitted single SELECT Scanner statements on the hardened DuckDB instance and returns exact JSON-safe results."
    tactic: "Implement extractStatements/prepare/StatementType.SELECT/zero-parameter admission, function-call lexical extraction, query/query_table and side-effect-function rejection, then execute on the dedicated Scanner connection."
    parallel_assumptions:
      - "DuckDB remains the authoritative SQL parser; the lexical helper only identifies invoked functions for policy checks."
    necessary_assumptions:
      - "Scanner must support broad SQL while protecting sessions/universe/cycles/history/latest from SELECT-shaped side effects."
    sufficiency_assumptions: []
    success_evidence:
      - "Real-DuckDB tests cover SELECT/JOIN/WHERE/GROUP/HAVING/ORDER/LIMIT/window/time/rank and duplicate result-column order."
      - "Empty/multi-statement/non-SELECT/parameter/query/query_table/side-effect cases are rejected and before/after fingerprints prove no authority mutation."
    depends_on: ["1.5"]
    children: []

  "5.2":
    status: approved
    strategy: "Scanner UI repeatedly executes one explicitly activated configuration with exact result/error semantics."
    tactic: "Implement SQL/positive-interval controls, draft-vs-active generation, immediate execute→await→setTimeout loop, non-overlap guard and exact result grid/error/empty rendering."
    parallel_assumptions:
      - "setTimeout-after-completion prevents catch-up/overlap without a scheduler framework."
    necessary_assumptions:
      - "Node SQL execution alone does not satisfy the recurring user workflow."
    sufficiency_assumptions: []
    success_evidence:
      - "Unit tests prove generation replacement, draft inactivity, positive interval, no overlap and no catch-up."
      - "Chromium proves immediate activation, repeated execution, zero-row success, visible error and exact returned columns/row order with no hidden rank/sort/filter/LIMIT."
    depends_on: ["3.3", "5.1"]
    children: []

  "5.3":
    status: approved
    strategy: "A Scanner result can reuse the canonical Detail/History surface instead of creating a parallel security view."
    tactic: "Recognize the product-supported canonical SecurityId result column/shape and route activation through existing Detail navigation."
    parallel_assumptions:
      - "One Detail surface preserves identity/history semantics and avoids duplicated state."
    necessary_assumptions:
      - "The Product Spec requires Scanner→Detail navigation when canonical SecurityId is available."
    sufficiency_assumptions: []
    success_evidence:
      - "Chromium proves a Scanner result SecurityId opens the same Detail component and historical/current rules as Current navigation."
      - "Queries without recognized SecurityId remain ordinary result tables."
    depends_on: ["4.2", "5.2"]
    children: []

  "5.4":
    status: approved
    strategy: "Named user Scanner queries have one durable Node-owned persistence model with explicit transactional schema evolution and safe CRUD protocol semantics."
    tactic: "Upgrade DuckDB bootstrap to schema v2 with one explicit v1→v2 migration, add scanner_saved_queries, implement normalized-name validation plus Viewer-role list/create/update/delete operations through the serialized writer, and prove market-authority isolation."
    parallel_assumptions:
      - "The existing writer queue and service fixture can own configuration writes without a separate DB or repository abstraction."
    necessary_assumptions:
      - "Browser-only persistence would fragment saved queries by Origin/browser lifecycle and would not satisfy one durable local product state."
      - "The existing schema-v1 contract cannot persist saved queries without an explicit reviewed schema change."
    sufficiency_assumptions: []
    success_evidence:
      - "Real-DuckDB tests prove fresh schema-v2 bootstrap, exact v1→v2 preservation, idempotent v2 reopen and unsupported-schema fail-closed behavior."
      - "Real-service protocol tests prove durable create/list/update/rename/delete, restart persistence, deterministic ordering, NOT_FOUND, normalized-name conflicts and built-in read-only rejection."
      - "Injected CRUD/migration failures leave sessions/universe/cycles/history/latest unchanged and no failed operation is acknowledged as success."
    depends_on: ["1.5", "5.1"]
    children: []

  "5.5":
    status: approved
    strategy: "Scanner users can browse built-ins and multiple saved queries, edit them safely and reuse them without library actions silently changing the active Scanner generation."
    tactic: "Add stable source-defined built-ins, Viewer-client query-library methods and Scanner UI controls for select/new/save-as/save/rename/delete; keep selected/draft/persisted/active state explicit and route built-in copies through normal user-query creation."
    parallel_assumptions:
      - "The existing Scanner surface can absorb a compact library editor without a frontend framework or separate settings application."
    necessary_assumptions:
      - "Durable CRUD alone is not usable unless the browser exposes clear selection/edit/copy/delete semantics."
    sufficiency_assumptions: []
    success_evidence:
      - "Unit tests prove deterministic built-in/user merge, built-in flags, draft loading, Save-As/update/delete state transitions and active-generation isolation."
      - "Chromium proves both built-ins are visible/read-only/copyable; multiple user queries can be created, selected, edited, renamed, persisted across Viewer reopen and deleted with explicit conflict/error states."
      - "Library selection/save/delete while a Scanner generation is active does not alter that generation until explicit Activate."
    depends_on: ["5.2", "5.4"]
    children: []

  "5.6":
    status: approved
    strategy: "A user or AI can author new Scanner SQL from one accurate durable guide whose schema and examples cannot silently drift from executable reality."
    tactic: "Create docs/SCANNER_SQL_GUIDE.md from the current public Scanner schema/known semantics, include bounded executable examples and an AI prompt template, then add metadata/built-in synchronization tests that fail when schema or examples change without the guide."
