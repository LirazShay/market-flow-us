  "4.3":
    status: approved
    strategy: Demo Buy backend authority is explicit: schema stores facts/provenance, capture resolves the exact writer-ordered baseline, and trusted reads compute post-watermark outcomes.
    tactic: Separate schema/persistence, serialized capture/protocol authority and bounded evaluation/read-model responsibilities.
