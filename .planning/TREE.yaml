  "4.4.1":
    status: approved
    strategy: The exact rendered Scanner generation converts into bounded manual/automatic captures without changing SQL order/provenance, while recurring scanning remains explicitly controllable.
    tactic: Add recognized-ID selection, synchronous generation snapshot, Selected/All/Top-X actions, Viewer-session Auto Off/All/Top-X, persistent Auto indicator/Turn off, one capture slot and resumable Stop recurring scan.
    parallel_assumptions:
      - Busy auto generations are visibly skipped rather than queued.
    necessary_assumptions:
      - Without capture controls observations cannot be created practically.
      - Background Auto must remain visible/controllable when Scanner is hidden.
    sufficiency_assumptions: []
    success_evidence:
      - Exactly one recognized identity column is required; invalid rows are never silently included and checkbox interaction never opens Detail.
      - Selected/All/Top-X choose source rows before dedupe, preserve original returned positions, enforce 5000 unique-item bound, show source-row versus unique-item counts and reset selection on a new rendered generation.
      - Capture freezes the displayed generation synchronously before async submission; later Scanner refresh cannot alter an in-flight capture.
      - Auto changes affect only future successful generations; zero-row is no-op; busy generations increment bounded skip status rather than queue.
      - Persistent Viewer-level Auto indicator is visible across top-level surfaces and Turn off affects future generations only, never pretending to cancel an in-flight capture.
      - One capture slot prevents manual double-submit/unbounded queues and distinguishes committed/rejected/acknowledgement-unknown states.
      - Stop recurring scan cancels future scheduling and ignores stale in-flight results while allowing a later Activate; Auto may remain armed but produces no capture while scanning is stopped.
    depends_on: ["4.3.2", "4.2", "5.2"]
    children: []

  "4.4.2":
    status: approved
    strategy: A dedicated Demo Buy screen makes baseline and all requested future outcomes understandable and stable under continuing Auto capture.
    tactic: Add top-level Demo Buy over page/observation/capture-detail reads with capture grouping, sticky identity columns, compact horizon cells, Refresh latest, Refresh observation and Load more.
    parallel_assumptions: []
    necessary_assumptions:
      - Stored/evaluated observations must be inspectable by the user.
    sufficiency_assumptions: []
    success_evidence:
      - Unit/browser tests cover loading/empty/populated/first-page error/continuation error/provenance error/targeted-refresh error while preserving prior trustworthy data where possible.
      - Capture groups show query/timing/mode context once; a page split inside one capture repeats/marks the header so rows never lose provenance context.
      - Sticky leading identity/baseline columns remain visible while ten horizons render as one compact cell each containing outcome + percentage + Price where applicable.
      - `resultRank` is presented neutrally as returned Scanner Position unless SQL ordering is explicitly being explained; position 1 alone is never labeled best/top-ranked.
      - NO_FUTURE_OBSERVATION is presented as Pending while non-temporal unavailable reasons remain explicit warnings; direction never relies on color alone.
      - Refresh latest resets to first page; Load more appends stable continuation; Refresh observation updates one target in place even while newer Auto captures arrive.
      - Provenance/SQL loads on demand and timing anomalies are inspectable without overriding authority semantics.
      - E2E proves manual/Top-X/Auto capture, progressive completion, provenance immutability, acknowledgement-unknown recovery and Scanner/Viewer lifecycle.
    depends_on: ["4.3.3", "4.4.1", "5.2"]
    children: []

  "4.5":
    status: approved
    strategy: A Demo Buy observation can become a reproducible local AI Investigation Pack that supports strategy improvement without hindsight leakage, false ranking claims, accidental system/session disclosure or automatic AI control.
    tactic: Build a deterministic Node evidence exporter with explicit sharing-safe projections, then expose generation/copy/regeneration controls from Demo Buy.
    parallel_assumptions:
      - The useful AI boundary is evidence packaging and disciplined prompting, not automatic cloud integration.
    necessary_assumptions:
      - Outcome inspection alone does not systematically explain why the query returned a candidate or what pre-buy evidence might improve SQL.
    sufficiency_assumptions:
      - Exporter plus UI workflow make forensic evidence usable while preserving human control, local privacy and explicit evidence limitations.
    success_evidence:
      - Pack contains exact user-authored SQL plus sharing-safe bounded Scanner context, authority-watermarked pre-buy history, exact baseline projection, post-watermark 10-minute history, trusted outcomes, manifest, field guide and anti-hindsight prompt.
      - Prompt/UI treats resultRank as returned position unless deterministic SQL ordering establishes ranking semantics.
      - System-owned operational/session data and redacted arbitrary Scanner text never enter shareable files, prompt, response metadata or diagnostics.
      - No AI API/key/cloud dependency or automatic SQL mutation is introduced.
    depends_on: []
    children: ["4.5.1", "4.5.2"]

  "4.5.1":
    status: approved
    strategy: Node can deterministically generate a sharing-safe local AI Investigation Pack for one captured security.
    tactic: Add demo.buy.ai-pack.create that validates membership/provenance, reuses the trusted evaluator, derives explicit sharing-safe history/context projections and atomically publishes a controlled export directory.
    parallel_assumptions:
      - OUTCOME.json reuses the existing evaluator rather than duplicating horizon logic.
    necessary_assumptions:
      - A prompt alone is insufficient without reproducible evidence files and strict authority/time/sharing boundaries.
    sufficiency_assumptions: []
    success_evidence:
      - Prediction-time history is limited by cycle_id <= buy_cycle_id and the 30-minute time window; outcome history requires cycle_id > buy_cycle_id and ends at captured_at_ms + 10m.
      - COMPLETE_OUTCOME is based on committed post-watermark evidence reaching the 10-minute boundary; otherwise the pack remains honestly PARTIAL_OUTCOME.
      - Persisted SCANNER_CONTEXT preserves first-50 returned order/positions and bounded retained-column/truncation metadata; position>50 targets remain investigable with targetInScannerContext=false.
      - Shareable history/baseline files allowlist authority keys + documented provider market fields/raw_data and omit session_id, producer/session/config/error/request/source_metadata/path fields.
      - Shareable SCANNER_CONTEXT preserves structural metadata, identity, numeric/null/boolean and documented market-text values; other string/array/object contents are emitted only as bounded redaction metadata with redactedForSharing=true.
      - Canary operational/session/arbitrary-text values are absent byte-for-byte from every generated file, prompt, response metadata and diagnostics; manifest exposes counts only, never redacted content.
      - PROMPT enforces prediction-time/outcome separation, returned-position-vs-ranking discipline, fact/derived/hypothesis labeling, minimal SQL proposals, peer limitations and multi-observation validation.
      - Bundle contains README/PROMPT/MANIFEST/QUERY/SCANNER_CONTEXT/TARGET_BEFORE/BASELINE/TARGET_AFTER/OUTCOME/FIELD_GUIDE.
      - Exact user-authored QUERY.sql remains verbatim while README/UX warns the user to review it before external sharing.
      - Export root/path is product-owned, repository-relative/public-safe, browser supplies no path, temporary directory + atomic rename prevents partial final packs and successful packs are never overwritten.
      - Export response contains bounded relative path/metadata/prompt only; prompt is bounded and no evidence/redacted payload enters diagnostics.
      - Export lost ACK is safe to regenerate after reconnect because export mutates no DB authority; regeneration creates a new collision-safe pack.
      - One pack generation mutates no DB authority and representative export timing is measured without adding a second transport/worker.
    depends_on: ["4.3.2", "4.3.3"]
    children: []

  "4.5.2":
    status: approved
    strategy: Demo Buy UI lets the user investigate one observation, generate/copy/regenerate an AI pack and understand evidence/sharing limitations without leaving the local workflow.
    tactic: Add an expandable Investigate with AI panel, targeted refresh, one Viewer-wide export slot, partial/complete/context-coverage state, neutral returned-position wording, pre-share warning, relative path and clipboard fallbacks.
    parallel_assumptions: []
    necessary_assumptions:
      - A backend exporter is not useful if the user cannot invoke and understand it from the observation being investigated.
    sufficiency_assumptions: []
    success_evidence:
      - Panel shows target identity/returned position, horizon progress, targetInScannerContext and PARTIAL_OUTCOME/COMPLETE_OUTCOME before/after generation.
      - Position 1 is never presented as best/top-ranked unless the exact SQL ordering justifies that statement.
      - Before Generate/Regenerate the UI warns that exact Scanner SQL and market evidence will be shareable and should be reviewed; no automatic upload occurs.
      - At most one Generate/Regenerate request is in flight per Viewer; additional export actions are visibly disabled/refused rather than queued.
      - Generate returns relative local folder + file count; Copy AI Prompt and Copy folder path use clipboard with selectable fallback text.
      - PARTIAL pack can be safely regenerated after later evidence; export lost-ACK guidance permits safe regeneration, unlike capture lost-ACK behavior.
      - Chromium E2E proves ordered and unordered returned-position-1 investigations, sharing-safe file/content boundaries, prompt copy, targeted refresh and regeneration plus a position>50 reduced-context case.
      - No automatic AI call, upload or SQL activation exists.
    depends_on: ["4.5.1", "4.4.2", "5.2"]
    children: []

