version: 2
root: "0"

nodes:
  "0":
    status: draft
    strategy: "Market Flow US is a complete, locally runnable and verifiable U.S.-market analysis product that preserves the proven MarketScope operating model while replacing only Israel-specific provider/data assumptions."
    tactic: "Complete seven necessary migration capabilities: U.S. acquisition, U.S. data authority, trusted U.S. reads/surfaces, Scanner strategy adaptation, deterministic offline proof, operational packaging/verification infrastructure, and bounded live cutover/release closure."
    parallel_assumptions:
      - "The exhaustive 124-file migration audit and reviewed U.S. contracts identify the material conversion boundaries."
      - "Preserving proven MarketScope mechanisms is lower-risk than reconstructing them."
      - "Strategy-specific candidate selection can remain editable Scanner SQL unless workload evidence proves a narrower optimization necessary."
    necessary_assumptions: []
    sufficiency_assumptions:
      - "Provider acquisition alone is insufficient without U.S. persistence, reads, UI, Scanner, deterministic proof and release evidence."
      - "The seven branches jointly cover every required migration area from the audited contracts while excluding order execution and other non-goals."
    success_evidence:
      - "Every implementation-ready leaf is completed with its stated evidence."
      - "The authoritative runtime no longer depends on MapHeat2/GetSecuritiesData or Israeli typed market fields."
      - "Current, Detail/History and Scanner operate over schema-v3 U.S. authority."
      - "Fast CI, Browser CI and the representative U.S. workload are green on the final candidate."
      - "The bounded authenticated U.S. provider gate is PASS."
      - "Final branding/docs/launchers describe Market Flow US and main is green with no blocking defect."
    depends_on: []
    children: ["1", "2", "3", "4", "5", "6", "7"]

  "1":
    status: draft
    strategy: "The browser can repeatedly acquire one exact complete U.S. screener snapshot and turn it into the existing producer-cycle contract without Israel-specific provider logic."
    tactic: "Replace MapHeat/GetSecuritiesData acquisition with a ScreenerHulPaging3 adapter, then adapt Recorder membership handling so each validated full response becomes one one-segment cycle and universe revisions change only when canonical membership changes."
    parallel_assumptions:
      - "The proven one-request U.S. screener response contains both current membership and the source rows needed for one cycle."
      - "Keeping the existing cycle/protocol boundary with one physical segment minimizes migration risk."
    necessary_assumptions:
      - "No downstream persistence or UI can be correct until the browser produces exact U.S. authority candidates."
    sufficiency_assumptions:
      - "Exact U.S. provider validation plus Recorder/universe-revision integration is sufficient to replace the Israel-specific acquisition boundary."
    success_evidence:
      - "Synthetic provider tests prove exact completeness, canonical PaperId identity, row-order independence, failure cases and raw-row fidelity."
      - "Recorder tests prove one-segment cycles, non-overlap, membership-change revision behavior and fail-closed failure reporting."
    depends_on: []
    children: ["1.1", "1.2"]

  "1.1":
    status: draft
    strategy: "ScreenerHulPaging3 responses are acquired and validated exactly before any row can enter product authority."
    tactic: "Implement the same-origin U.S. request builder/parser/validator from DATA_CONTRACT, preserving source metadata/raw rows and producing canonical String(PaperId) membership plus one-segment cycle data."
    parallel_assumptions:
      - "The extracted provider evidence is sufficient to implement deterministic validation without inventing unproven semantics."
    necessary_assumptions:
      - "Without exact provider validation, partial/duplicate/malformed U.S. data could become authoritative."
    sufficiency_assumptions: []
    success_evidence:
      - "Unit tests cover request parameters, successful full response, recordCount mismatch, malformed payload, HTTP failure, missing/duplicate PaperId, row reorder and null/zero/missing fields."
      - "No test or production code hard-codes 4015 as universe size."
      - "Price/DailyVolume/PaperMarketCap/TradeDateTime remain source-shaped and raw_data retains original properties."
    depends_on: []
    children: []

  "1.2":
    status: draft
    strategy: "Continuous recording uses each validated U.S. response as one coherent cycle while preserving producer lifecycle and exact current-universe revision semantics."
    tactic: "Adapt Recorder/runtime composition to remove active chunk-size/delay assumptions, compare canonical membership, replace universe only when membership changes, and commit the same validated response under the acknowledged revision."
    parallel_assumptions:
      - "The imported Recorder lifecycle/scheduling/ACK behavior remains valid when provider collection becomes one full request."
    necessary_assumptions:
      - "The U.S. provider adapter alone does not coordinate universe revisions, repeated cadence, stop/failure behavior or producer ACKs."
    sufficiency_assumptions: []
    success_evidence:
      - "Unit/service tests prove same-membership reuse, add/remove membership revision, row-order invariance, no overlapping cycles, explicit stop and provider-failure fail-closed behavior."
      - "One U.S. cycle reports chunkIndex 0 and chunk_count 1 without pretending the provider is multi-chunk."
      - "Initial demo/offline snapshot interval remains 3000 ms and is not encoded into DB schema."
    depends_on: ["1.1"]
    children: []

  "2":
    status: draft
    strategy: "Node/DuckDB stores U.S. market authority atomically under schema v3 while preserving proven MarketScope transaction, history/latest and recovery behavior."
    tactic: "Introduce a fresh U.S. schema-v3 market projection, adapt universe/cycle persistence to the new fields and one-segment payload, and prove exact commit/rollback/session behavior with real DuckDB."
    parallel_assumptions:
      - "The existing six market-authority tables plus scanner_saved_queries remain sufficient; only their U.S. projection and compatibility policy need change."
      - "Rejecting old MarketScope DB schemas is safer than semantically converting Israeli history into U.S. facts."
    necessary_assumptions:
      - "Validated browser data is not trusted product authority until Node persists it atomically."
    sufficiency_assumptions:
      - "Schema-v3 lifecycle, U.S. projection persistence and end-to-end producer authority together provide durable U.S. authority without redesigning DuckDB."
    success_evidence:
      - "Fresh DB boots as schema v3 with documented tables/columns and hardened connections."
      - "Old MarketScope v1/v2 DBs are rejected without mutation."
      - "Real-DuckDB fault tests prove all-or-nothing history/latest/session authority."
    depends_on: []
    children: ["2.1", "2.2", "2.3"]

  "2.1":
    status: draft
    strategy: "A fresh Market Flow US database has one explicit schema-v3 lifecycle and cannot accidentally reinterpret old MarketScope data."
    tactic: "Replace the Israeli market projections in schema bootstrap with the documented U.S. universe/history/latest columns, retain scanner_saved_queries, change the default DB filename, and fail closed on incompatible v1/v2 databases."
    parallel_assumptions:
      - "A new product DB filename plus explicit incompatible-version rejection removes the need for a semantic Israel-to-US data migration."
    necessary_assumptions:
      - "Persistence cannot safely accept U.S. rows until table/schema truth matches the U.S. contract."
    sufficiency_assumptions: []
    success_evidence:
      - "Database lifecycle tests prove fresh v3 bootstrap, reopen, required U.S. columns, saved-query table, new default filename and v1/v2 no-mutation rejection."
      - "DuckDB hardening and connection ownership remain unchanged."
    depends_on: []
    children: []

  "2.2":
    status: draft
    strategy: "One complete U.S. cycle persists exact U.S. typed projections plus raw rows into history/latest transactionally."
    tactic: "Adapt cycle-authority validation/projection/SQL to schema v3 while preserving serialized cycle-id allocation, history append, full latest replacement, session counters and construction-only fault seams."
    parallel_assumptions:
      - "The existing transaction model remains correct because the U.S. response still represents one complete current universe."
    necessary_assumptions:
      - "Schema v3 alone does not make U.S. cycle commits correct."
    sufficiency_assumptions: []
    success_evidence:
      - "Real-DuckDB tests prove U.S. field fidelity, null/zero/missing projection rules, raw_data preservation, exact membership rejection and successful history/latest replacement."
      - "Fault injection at each persistence phase leaves prior authority unchanged."
      - "History count grows by exactly one row per committed security per cycle."
    depends_on: ["2.1"]
    children: []

  "2.3":
    status: draft
    strategy: "Browser producer ownership, universe revision and U.S. cycle ACKs work end-to-end against the real local service."
    tactic: "Adapt producer persistence/config validation only where U.S. Recorder configuration/universe metadata changed, then prove session start/heartbeat/universe replace/commit/failure/restart through real WebSocket and DuckDB."
    parallel_assumptions:
      - "The existing protocol message families can carry the U.S. conversion without a protocol rewrite."
    necessary_assumptions:
      - "Provider and DB units can both be correct while the actual producer/session integration between them is still wrong."
    sufficiency_assumptions: []
    success_evidence:
      - "Real-service tests prove first universe ACK + same-response commit, unchanged-membership cycles, changed-membership revision, failure recording, heartbeat and restart recovery."
      - "Sanitized producer config no longer requires Israel-only chunk settings."
    depends_on: ["1.2", "2.2"]
    children: []

  "3":
    status: draft
    strategy: "Trusted reads and the Viewer expose the same proven Current and Detail/History experience using U.S. authority fields."
    tactic: "Adapt Node read projections first, then adapt Current and Detail/History browser models/surfaces while preserving paging, refresh, navigation, null handling and state restoration."
    parallel_assumptions:
      - "The Viewer architecture is source-field agnostic once trusted Node reads expose the correct U.S. row shape."
    necessary_assumptions:
      - "Persisted U.S. data has little product value if Current and historical inspection still expect Israeli fields."
    sufficiency_assumptions:
      - "Trusted read adaptation plus both Viewer surfaces covers the user-facing non-Scanner analysis experience."
    success_evidence:
      - "Service tests prove U.S. Current/security/history/status shapes and historical-only lookup."
      - "Browser/unit tests prove the specified U.S. columns, default sorting, pagination and state preservation."
    depends_on: []
    children: ["3.1", "3.2", "3.3"]

  "3.1":
    status: draft
    strategy: "Node trusted reads return canonical U.S. Current, Security, History and status shapes from schema-v3 authority."
    tactic: "Replace Israeli read projections/metadata with PRODUCT_SPEC U.S. fields while preserving deterministic identity ordering, historical-only resolution, 500-row keyset paging and status semantics."
    parallel_assumptions:
      - "Read SQL/protocol shapes can change fields without changing paging/authority algorithms."
    necessary_assumptions:
      - "Viewer models must not query DuckDB directly or reconstruct U.S. data semantics independently."
    sufficiency_assumptions: []
    success_evidence:
      - "Real-service tests cover empty/current/historical-only security, U.S. row fields, 500-row continuation, cursor binding and unchanged status counts."
      - "Display-name source fields are available for the specified fallback."
    depends_on: ["2.2"]
    children: []

  "3.2":
    status: draft
    strategy: "Current presents the authoritative U.S. universe with the required columns, default sort and preserved interaction/state behavior."
    tactic: "Adapt Current model/surface to the U.S. column list and display-name fallback while retaining existing refresh, diagnostics, keyboard navigation, missing-value formatting and sort/scroll restoration."
    parallel_assumptions:
      - "The imported Current surface behavior is already correct; only data-field and branding assumptions require migration."
    necessary_assumptions:
      - "Trusted U.S. reads alone do not provide the required user-visible Current experience."
    sufficiency_assumptions: []
    success_evidence:
      - "Unit/E2E tests prove exact U.S. columns, DailyVolume DESC default, deterministic tie behavior, zero vs missing rendering, diagnostics and Current state restoration."
    depends_on: ["3.1"]
    children: []

  "3.3":
    status: draft
    strategy: "Detail/History presents current U.S. summary plus durable paged history, including historical-only securities."
    tactic: "Adapt Detail model/surface summary/history columns to U.S. fields while preserving open/back behavior, initial/continuation failures, paging and already-loaded-row retention."
    parallel_assumptions:
      - "The existing Detail state machine/paging logic remains valid under the U.S. row projection."
    necessary_assumptions:
      - "Current alone cannot satisfy persisted per-security analysis."
    sufficiency_assumptions: []
    success_evidence:
      - "Unit/E2E tests prove U.S. summary/history columns, 500-row continuation, retry, historical-only security and return-state restoration."
    depends_on: ["3.1"]
    children: []

  "4":
    status: draft
    strategy: "Scanner remains the general strategy surface over U.S. authority and ships an editable staged-candidate query without introducing a strategy subsystem."
    tactic: "Keep Scanner admission/execution and saved-query ownership, adapt built-ins/schema documentation/tests to U.S. fields, and add the reviewed staged-ranking SQL as a normal built-in."
    parallel_assumptions:
      - "The imported read-only Scanner and saved-query mechanisms are already sufficient for arbitrary U.S. analytical SQL."
      - "The staged candidate idea is expressible in DuckDB SQL over latest/history."
    necessary_assumptions:
      - "The product goal includes flexible analytical/ranking SQL and the requested candidate-selection workflow."
    sufficiency_assumptions:
      - "U.S. built-ins/documentation plus preserved Scanner/saved-query regression proof is enough; no dedicated strategy engine is necessary."
    success_evidence:
      - "The staged built-in executes against schema v3 and returns deterministic stage_reached ordering."
      - "Saved-query CRUD/Draft/Persisted/Active semantics remain green."
      - "Scanner security/admission regression remains green."
    depends_on: []
    children: ["4.1", "4.2"]

  "4.1":
    status: draft
    strategy: "The built-in/query-authoring layer describes and executes U.S. schema correctly, including staged candidate ranking."
    tactic: "Replace Israeli built-ins with U.S. examples, implement the reviewed staged SQL, and mechanically align docs/SCANNER_SQL_GUIDE.md with the actual schema/built-ins."
    parallel_assumptions:
      - "Ordinary SQL is the smallest flexible mechanism for the requested ranking behavior."
    necessary_assumptions:
      - "An unchanged Scanner engine would still be unusable/misleading if examples and schema docs referenced Israeli fields."
    sufficiency_assumptions: []
    success_evidence:
      - "Built-in tests execute all U.S. queries against real schema v3."
      - "Staged fixture proves contiguous stage credit, missing-history stop and deterministic tie-breakers."
      - "At least all-current-fields, practical U.S. ranking and staged-candidate built-ins are present and bounded."
    depends_on: ["2.2"]
    children: []

  "4.2":
    status: draft
    strategy: "Existing Scanner execution, scheduling, saved-query CRUD and Detail navigation remain fully functional after U.S. schema migration."
    tactic: "Adapt only schema-sensitive Scanner/saved-query/browser tests and labels while preserving the proven admission engine, scheduler and persistence design."
    parallel_assumptions:
      - "Most Scanner code is deliberately provider-agnostic and should not be rewritten."
    necessary_assumptions:
      - "New built-ins alone do not prove the existing reusable Scanner product behavior survived schema/branding changes."
    sufficiency_assumptions: []
    success_evidence:
      - "Unit/service/E2E Scanner tests remain green with U.S. built-ins and schema."
      - "A result containing security_id AS securityId still opens the correct Detail security."
      - "Loading/editing/saving/deleting a query does not implicitly replace an active generation."
    depends_on: ["4.1"]
    children: []

  "5":
    status: draft
    strategy: "The entire U.S. product can be exercised deterministically offline through the normal browser runtime, real local service and synthetic U.S. provider."
    tactic: "Replace the Fake Market provider behavior, integrate the normal U.S. runtime/demo with it, and adapt full Chromium E2E to prove product behavior including dynamic universe membership."
    parallel_assumptions:
      - "A stateful loopback ScreenerHulPaging3 fake can prove almost all product behavior without bank credentials."
    necessary_assumptions:
      - "Unit/service tests cannot prove actual browser fetch/runtime/UI composition or provide a safe offline demo."
    sufficiency_assumptions:
      - "Canonical U.S. fake, normal runtime integration and browser E2E together cover deterministic end-to-end product proof."
    success_evidence:
      - "One-command demo runs the normal U.S. runtime against real local authority."
      - "Chromium E2E covers normal movement, membership change, failures, Current, Detail/History, Scanner and recovery."
    depends_on: []
    children: ["5.1", "5.2", "5.3"]

  "5.1":
    status: draft
    strategy: "Fake Market models the U.S. screener contract deterministically without real authentication."
    tactic: "Replace MapHeat2/GetSecuritiesData fixtures with a stateful ScreenerHulPaging3 endpoint and synthetic U.S. rows/scenarios from TEST_STRATEGY."
    parallel_assumptions:
      - "The fake can preserve provider-shape fidelity without copying private authenticated data."
    necessary_assumptions:
      - "Browser E2E and demo need a real HTTP provider boundary matching the new production adapter."
    sufficiency_assumptions: []
    success_evidence:
      - "Fake Market tests cover complete response, reorder, add/remove, duplicate/missing PaperId, recordCount mismatch, null/zero/missing, malformed shape, HTTP error, delay and advancing values."
      - "Fixtures contain only synthetic/sanitized data."
    depends_on: ["1.1"]
    children: []

  "5.2":
    status: draft
    strategy: "The normal Market Flow US browser runtime and one-command demo compose U.S. provider, Recorder, Node authority and Viewer without special test-only product paths."
    tactic: "Adapt runtime composition/demo orchestration to the U.S. provider/Recorder contract while preserving same source graph, Viewer reuse, explicit service recovery and deterministic demo reset."
    parallel_assumptions:
      - "The imported runtime shell and build architecture remain valid once dependency injection points use the U.S. adapter."
    necessary_assumptions:
      - "A correct fake and correct components do not prove the normal built runtime actually wires them together."
    sufficiency_assumptions: []
    success_evidence:
      - "Runtime composition tests and demo service tests prove U.S. collection through real WebSocket/DuckDB."
      - "Demo reset touches only .demo and restart preserves expected authority until reset."
    depends_on: ["1.2", "2.3", "5.1"]
    children: []

  "5.3":
    status: draft
    strategy: "Chromium proves the complete offline U.S. user journey and failure/recovery behavior through the normal runtime."
    tactic: "Adapt existing E2E suites to U.S. fields/Fake Market and add full-response membership-change/staged-Scanner scenarios without replacing proven state-machine coverage."
    parallel_assumptions:
      - "The existing Playwright suite already covers the right surfaces and can be migrated rather than recreated."
    necessary_assumptions:
      - "Service/unit proof cannot validate DOM interaction, browser lifecycle and composed product behavior."
    sufficiency_assumptions: []
    success_evidence:
      - "Full Browser suite is green against U.S. Fake Market."
      - "E2E proves Current, Detail/History, Scanner, saved-query behavior, refresh preservation, Viewer/producer independence, explicit recovery and add/remove membership."
    depends_on: ["3.2", "3.3", "4.2", "5.2"]
    children: []

  "6":
    status: draft
    strategy: "Market Flow US is operationally packaged, diagnosable and measured at representative U.S. scale before any live release claim."
    tactic: "Complete product branding/local launchers, adapt diagnostics/live-verification tooling, and replace the representative workload with U.S.-scale data plus staged SQL measurement."
    parallel_assumptions:
      - "The imported operational tooling is structurally reusable but contains MarketScope/provider/561-specific assumptions."
    necessary_assumptions:
      - "A working browser/runtime is not release-ready without correct packaging, diagnostics, scale evidence and a U.S.-aware live gate."
    sufficiency_assumptions:
      - "Packaging/branding, diagnosability/live-gate tooling and representative workload jointly prepare a verifiable release candidate."
    success_evidence:
      - "User-facing package/artifact/DB/launcher names are Market Flow US."
      - "Diagnostics remain sanitized and localize U.S. provider/runtime failures."
      - "4096 x 180 workload is correct and reports staged-query measurements."
    depends_on: []
    children: ["6.1", "6.2", "6.3"]

  "6.1":
    status: draft
    strategy: "Local setup/build/run artifacts and user documentation consistently identify and operate Market Flow US."
    tactic: "Rename package, generated runtime/bookmarklet, default/demo DB, browser/global keys, CI/artifact labels and real-provider launcher; adapt START_HERE/USER_GUIDE while preserving thin-wrapper behavior."
    parallel_assumptions:
      - "Branding/file-path changes are mechanical when done after the product contracts are fixed and protected by launcher/build tests."
    necessary_assumptions:
      - "A final U.S. product cannot safely ship under conflicting MarketScope filenames/DB defaults."
    sufficiency_assumptions: []
    success_evidence:
      - "Build/launcher tests prove documented target names and commands."
      - "No user-facing runtime path writes to the old market-scope.duckdb default."
      - "Donor naming remains only in provenance/history documentation where intentional."
    depends_on: ["2.1"]
    children: []

  "6.2":
    status: draft
    strategy: "Diagnostics and the SHA-bound bounded live-verification harness understand the U.S. acquisition path without exposing private session data."
    tactic: "Adapt provider checkpoints/messages/report identity and live harness from MapHeat/chunk acquisition to a bounded three-cycle ScreenerHulPaging3 repeatability run while preserving Support Snapshot and safe CLI fallback."
    parallel_assumptions:
      - "The imported diagnostic tracker and bounded live-gate structure remain valid; only U.S. provider steps/branding change."
    necessary_assumptions:
      - "Real-provider failures must be self-localizing and the final external gate must exercise the production U.S. path."
    sufficiency_assumptions: []
    success_evidence:
      - "Unit/service tests prove U.S. checkpoint success/failure shaping and sanitized reports."
      - "Live-verification build remains clean-checkout/SHA-bound and emits Market Flow US artifacts."
      - "No report includes credentials, cookies, account identifiers or raw authenticated dumps."
    depends_on: ["2.3", "3.1", "4.2", "6.1"]
    children: []

  "6.3":
    status: draft
    strategy: "Representative U.S. scale is measured for persistence, reads, restart and staged Scanner SQL before release."
    tactic: "Replace the 561 x 600 Israeli workload with 4096 synthetic U.S. securities x 180 cycles, U.S. field generation and the required Scanner/staged query measurement/report."
    parallel_assumptions:
      - "4096 x 180 is large enough to expose approximately-4k scaling issues while remaining a practical manual/CI-dispatch workload."
      - "Measurement-first is preferable to adding unproven temporal precomputation."
    necessary_assumptions:
      - "Small deterministic tests cannot establish whether direct history SQL is practical at intended U.S. scale."
    sufficiency_assumptions: []
    success_evidence:
      - "Workload proves 180 completed cycles, 4096 latest rows, 737280 history rows, restart count preservation and zero failed cycles."
      - "Report contains commit/Current/History/general Scanner/staged Scanner/restart/DB-size measurements."
      - "If staged SQL is materially impractical, this node does not close; the smallest performance planning area is reopened."
    depends_on: ["2.3", "4.1"]
    children: []

  "7":
    status: draft
    strategy: "The migrated product is proven offline, validated on the real authenticated U.S. provider boundary and released with no authoritative Israel-only runtime assumptions."
    tactic: "Run final offline gates on one candidate, execute the bounded live-provider gate, then perform final migration/documentation/main-state closure."
    parallel_assumptions:
      - "Deterministic offline proof should precede expensive/external live verification."
      - "The live gate is needed only for provider/browser facts that cannot be proven offline."
    necessary_assumptions:
      - "Implementation is not complete merely because individual migration branches pass in isolation."
    sufficiency_assumptions:
      - "Final offline proof, bounded real-provider PASS and release audit together establish end-to-end completion."
    success_evidence:
      - "Final candidate Fast CI, Browser CI and U.S. workload are green."
      - "Real-provider gate reports overall PASS."
      - "Final repository audit finds no authoritative MapHeat2/GetSecuritiesData/Israeli-field runtime path and main is green."
    depends_on: []
    children: ["7.1", "7.2", "7.3"]

  "7.1":
    status: draft
    strategy: "One release candidate passes every deterministic offline gate before live verification."
    tactic: "Run full Fast, full Browser and representative U.S. workload on the integrated candidate; fix any migration regressions at their owning leaf before accepting the candidate."
    parallel_assumptions:
      - "A single integrated candidate gate catches cross-branch drift that focused leaf tests may miss."
    necessary_assumptions:
      - "Live provider testing should not be used to discover deterministic product regressions."
    sufficiency_assumptions: []
    success_evidence:
      - "Fast CI is green."
      - "Browser CI is green."
      - "U.S. representative workload is green with a sanitized report."
      - "No blocking deterministic defect remains."
      - "Fast/Browser feedback remains within the imported test-feedback guidance or any measured regression has a documented irreducible cause; no avoidable focused+full duplication is added."
    depends_on: ["5.3", "6.2", "6.3"]
    children: []

  "7.2":
    status: draft
    strategy: "The release candidate works through the real authenticated Bank Leumi U.S. provider boundary without weakening security or authority semantics."
    tactic: "Run the SHA-bound bounded live gate for three consecutive complete cycles at the candidate cadence on the supported authenticated provider page, and treat any contract-changing failure as a planning/implementation blocker rather than bypassing it."
    parallel_assumptions:
      - "The live gate is the smallest safe way to prove provider shape, current one-request completeness and browser loopback compatibility."
    necessary_assumptions:
      - "Provider/CSP/session behavior is external and cannot be honestly certified by Fake Market alone."
    sufficiency_assumptions: []
    success_evidence:
      - "Sanitized report is SHA-bound and overall PASS."
      - "Report proves three consecutive complete U.S. cycles, revision handling, COMMIT ACK for every cycle, final Current, Security, History containing the live cycles, Scanner, ownership and clean stop."
      - "No credential/session/private response material is committed."
    depends_on: ["7.1"]
    children: []

  "7.3":
    status: draft
    strategy: "Repository truth, local run instructions and final runtime contain only the intended Market Flow US product direction and are ready for normal use from main."
    tactic: "Perform final migration/branding audit, remove or rename superseded Israel-only authoritative runtime artifacts, update durable docs/status/handoff truth, merge through green CI and verify main."
    parallel_assumptions:
      - "Cleanup after replacement proof is safer than deleting donor behavior early."
    necessary_assumptions:
      - "A technically passing candidate can still be operationally misleading if old provider paths/names remain authoritative."
    sufficiency_assumptions: []
    success_evidence:
      - "Audit proves no authoritative MapHeat2/GetSecuritiesData or Israeli typed-field runtime dependency remains."
      - "START_HERE/USER_GUIDE/README/Scanner guide and launchers match actual U.S. behavior."
      - "No unexpected pre-existing/open PR conflicts with the release work unit."
      - "The release branch is internally consistent and ready for the normal PR/CI/squash-merge workflow defined by AGENTS.md."
      - "STATUS/handoff changes on the release branch point to the completion transition that becomes authoritative only after merge."
    depends_on: ["7.2", "6.1"]
    children: []
