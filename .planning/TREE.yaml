    strategy: The exact current Scanner generation converts into bounded manual/automatic Demo Buy capture requests without changing SQL order or provenance.
    tactic: Add recognized-ID gating, immutable generation snapshot, Selected/All/Top-X actions and Viewer-session Auto Off/All/Top-X with one shared capture slot.
    parallel_assumptions:
