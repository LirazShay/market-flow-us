  4.3.1:
    status: approved
    strategy: Schema v4 durably stores the minimum Demo Buy facts plus bounded original Scanner comparison provenance and safely upgrades valid v3 U.S. databases.
    tactic: Add demo_buy_captures/demo_buy_items, source_result_context_json, transactional v3→v4 migration/fresh-v4 bootstrap, restart behavior and new-day rotation.
    parallel_assumptions:
    - Baseline/future market facts remain in history.
    - Bounded first-50 Scanner context is provenance only, not market authority.
    necessary_assumptions:
    - Capture, AI investigation and restart cannot be trustworthy without explicit schema lifecycle ownership.
    sufficiency_assumptions: []
    success_evidence:
    - Fresh DB boots schema v4 with exact Demo Buy columns/constraints including bounded context JSON.
    - Valid v3→v4 migration preserves market authority and scanner_saved_queries; partial-v3-with-Demo-tables fails closed; injected migration failure leaves v3 usable.
    - Context contract is first 50 rows in original order, max 128 columns, deterministic per-cell truncation metadata, <=1 MiB serialized; over-budget/wide contexts fail visibly rather than silently dropping evidence.
    - Restart preserves active-day captures/context.
    - New-day accepts a valid v3 or v4 source, preserves saved queries, archives source unchanged if requested, and creates a fresh v4 DB with empty Demo Buy tables.
    depends_on:
    - '2.3'
    children: []
  4.3.2:
    status: approved
    strategy: A Demo Buy capture records exact selected candidates, immutable Scanner provenance/context and the authoritative baseline visible at its serialized writer point.
    tactic: Add demo.buy.capture validation/client-service protocol and same-writer all-or-nothing persistence; browser submits ordered deduped {securityId,resultRank} plus bounded generation context.
    parallel_assumptions:
    - Writer ordering defines the virtual-buy moment relative to market commits.
    necessary_assumptions:
    - Schema alone does not define race behavior, baseline linkage, capture bounds or acknowledgement semantics.
    sufficiency_assumptions: []
    success_evidence:
    - Protocol/unit tests reject malformed/duplicate/out-of-range items, invalid modes/bounds and invalid context.
    - Real-service tests prove all-or-nothing capture, original resultRank, immutable query/timing/context provenance, monotonic capture IDs and exact buy_cycle_id linkage.
    - captured_at_ms is assigned inside serialized writer work after any Viewer/socket queueing.
    - Lost transport acknowledgement after request submission is surfaced as ACKNOWLEDGEMENT_UNKNOWN, never as confirmed rejection; there is no blind automatic retry.
    - Capture stores no user-supplied or copied buy Price and does not mutate market authority.
    depends_on:
    - 4.3.1
    children: []
  4.3.3:
    status: approved
    strategy: One authoritative Node read model answers what happened after each virtual buy at all required horizons.
    tactic: Add demo.buy.page and demo.buy.capture.get using one set-wise consistent read snapshot, exact baseline join, first-at/after horizon matching and bounded keyset paging.
    parallel_assumptions: []
    necessary_assumptions:
    - Persisted capture facts do not answer the user's outcome question until later history is resolved and calculated.
    sufficiency_assumptions: []
    success_evidence:
    - New evaluation SQL passes mandatory static preflight before execution.
    - Fixtures prove target=captured_at_ms+horizon, first-at/after tie-break, delayed observations, null/zero/unavailable-reason semantics and baseline-integrity failure.
    - Read model exposes baseline/timing/provenance summary and all ten horizons; SQL detail is loaded once per capture.
    - Ordering is capture_id DESC then result_rank ASC with fixed 50-item cursor-bound paging and stable continuation while newer captures arrive.
    - Each page comes from one transactionally consistent DuckDB read snapshot.
    - Representative active-day timing is measured; no precompute/index/background updater is added absent evidence.
    depends_on:
    - 4.3.1
    children: []
