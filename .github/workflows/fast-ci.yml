name: Market Flow US Fast CI

on:
  push:
    branches: [main]
    paths:
      - "browser/**"
      - "shared/**"
      - "local-service/**"
      - "ibkr-order-service/**"
      - "scripts/**"
      - "tests/unit/**"
      - "tests/service/**"
      - "*.cmd"
      - "START_HERE.md"
      - "docs/SCANNER_SQL_GUIDE.md"
      - "docs/FIRST_RUN_ACCEPTANCE.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fast-ci.yml"
  pull_request:
    paths:
      - "browser/**"
      - "shared/**"
      - "local-service/**"
      - "ibkr-order-service/**"
      - "scripts/**"
      - "tests/unit/**"
      - "tests/service/**"
      - "*.cmd"
      - "START_HERE.md"
      - "docs/SCANNER_SQL_GUIDE.md"
      - "docs/FIRST_RUN_ACCEPTANCE.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fast-ci.yml"
  workflow_dispatch:

concurrency:
  group: market-flow-us-fast-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: Fast unit + service
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run unit and real-service suites
        shell: bash
        run: |
          set -uo pipefail

          npm run test:unit &
          unit_pid=$!
          npm run test:service &
          service_pid=$!

          status=0
          wait "$unit_pid" || status=$?
          wait "$service_pid" || status=$?
          exit "$status"
