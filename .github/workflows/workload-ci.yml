name: Market Flow US Workload

on:
  push:
    branches: [main]
    paths:
      - "browser/**"
      - "local-service/**"
      - "shared/**"
      - "tests/fake-market/**"
      - "tests/workload/**"
      - "scripts/run-workload-profile.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/workload-ci.yml"
  pull_request:
    paths:
      - "browser/**"
      - "local-service/**"
      - "shared/**"
      - "tests/fake-market/**"
      - "tests/workload/**"
      - "scripts/run-workload-profile.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/workload-ci.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: market-flow-us-workload-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bounded-end-to-end:
    name: Bounded end-to-end and 4k-width sanity
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run bounded end-to-end profiles
        env:
          MARKET_FLOW_US_WORKLOAD_PROFILE: ci
          MARKET_FLOW_US_WORKLOAD_REPORT: test-results/workload/ci-end-to-end.json
        run: node --test tests/workload/representative-workload.test.mjs

      - name: Print sanitized end-to-end report
        if: always()
        shell: bash
        run: |
          if [[ -f test-results/workload/ci-end-to-end.json ]]; then
            cat test-results/workload/ci-end-to-end.json
          else
            echo "Bounded end-to-end workload report was not produced."
          fi

      - name: Upload sanitized end-to-end report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: market-flow-us-workload-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: test-results/workload/ci-end-to-end.json

  isolated-probes:
    name: Isolated persistence/read/Scanner/Demo Buy sanity
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run isolated probes
        env:
          MARKET_FLOW_US_WORKLOAD_PROFILE: ci
          MARKET_FLOW_US_ISOLATED_REPORT: test-results/workload/ci-isolated.json
          MARKET_FLOW_US_DEMO_BUY_REPORT: test-results/workload/ci-demo-buy-evaluator.json
        run: >-
          node --test
          tests/workload/isolated-probes.test.mjs
          tests/workload/demo-buy-evaluator-probe.test.mjs
          tests/workload/pre-acceptance-integration-guard.test.mjs

      - name: Print sanitized isolated reports
        if: always()
        shell: bash
        run: |
          if [[ -f test-results/workload/ci-isolated.json ]]; then
            cat test-results/workload/ci-isolated.json
          else
            echo "Isolated workload report was not produced."
          fi
          if [[ -f test-results/workload/ci-demo-buy-evaluator.json ]]; then
            cat test-results/workload/ci-demo-buy-evaluator.json
          else
            echo "Demo Buy evaluator workload report was not produced."
          fi

      - name: Upload sanitized isolated reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: market-flow-us-workload-isolated-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            test-results/workload/ci-isolated.json
            test-results/workload/ci-demo-buy-evaluator.json
