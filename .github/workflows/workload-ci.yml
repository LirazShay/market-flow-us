name: Market Flow US Workload

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  bounded-workload:
    name: Bounded U.S. correctness and performance sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run bounded workload profiles
        run: npm run test:workload

      - name: Print sanitized workload reports
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          reports=(test-results/workload/*.json)
          if (( ${#reports[@]} == 0 )); then
            echo "Bounded workload reports were not produced."
            exit 0
          fi
          for report in "${reports[@]}"; do
            echo "--- ${report}"
            cat "${report}"
          done

      - name: Upload sanitized workload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-flow-us-workload-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: test-results/workload/*.json
