name: Market Flow US Workload

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  representative-workload:
    name: 4096 x 180 representative U.S. workload
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run representative workload
        env:
          MARKET_FLOW_US_WORKLOAD_REPORT: test-results/workload/representative-workload.json
        run: npm run test:workload

      - name: Print sanitized benchmark report
        if: always()
        shell: bash
        run: |
          if [[ -f test-results/workload/representative-workload.json ]]; then
            cat test-results/workload/representative-workload.json
          else
            echo "Representative workload report was not produced."
          fi

      - name: Upload sanitized workload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-flow-us-workload-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: test-results/workload/representative-workload.json
