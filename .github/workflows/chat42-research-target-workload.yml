name: Chat 42 Research Target Workload

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/workload/research-resource-probe.test.mjs"
      - "scripts/run-workload-profile.mjs"
      - ".github/workflows/chat42-research-target-workload.yml"

concurrency:
  group: chat42-research-target-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  target-4096:
    name: Representative 4,096-security Research W2
    if: github.head_ref == 'chat42-tree-11-8-workload-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run representative Research workload
        env:
          MARKET_FLOW_US_WORKLOAD_PROFILE: target-e2e
          MARKET_FLOW_US_RESEARCH_REPORT: test-results/workload/target-e2e-research-resource.json
        run: node --test tests/workload/research-resource-probe.test.mjs

      - name: Print sanitized representative Research report
        if: always()
        shell: bash
        run: |
          if [[ -f test-results/workload/target-e2e-research-resource.json ]]; then
            cat test-results/workload/target-e2e-research-resource.json
          else
            echo "Representative Research workload report was not produced."
          fi

      - name: Upload sanitized representative Research report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: market-flow-us-chat42-research-target-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: test-results/workload/target-e2e-research-resource.json
