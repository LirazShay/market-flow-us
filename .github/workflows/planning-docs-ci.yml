name: Market Flow US Planning Docs CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reject orphaned open PRs after main merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t open_prs < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].number'
          )
          if (( ${#open_prs[@]} > 0 )); then
            echo "Unexpected open PRs remain after a main merge: ${open_prs[*]}"
            exit 1
          fi

      - name: Validate Market Flow US planning truth
        shell: bash
        run: |
          set -euo pipefail

          required=(
            AGENTS.md README.md STATUS.yaml
            .planning/README.md .planning/FRAMEWORK.md .planning/GOAL.md .planning/TREE.yaml
            .planning/DECISIONS.md .planning/REVIEWS.md .planning/IBKR_ORDER_REVIEWS.md .planning/STATUS.yaml
            .planning/EXECUTION.yaml .planning/EXECUTOR_HANDOFF.md .planning/verify-handoff.mjs
            .planning/IBKR_ORDER_MINI_PROJECT.md .planning/MARKET_REPLAY_MINI_PROJECT.md
            docs/US_MIGRATION_AUDIT.md docs/US_MIGRATION_FILE_MAP.md docs/US_CONTRACT_REVIEW.md
            docs/US_PRODUCT_DIRECTION.md docs/US_SOURCE_EVIDENCE.md
            docs/PRODUCT_REQUIREMENTS.md docs/PRODUCT_SPEC.md docs/DATA_CONTRACT.md
            docs/TECHNICAL_SPEC.md docs/TEST_STRATEGY.md docs/SOURCE_EXTRACTION.md
            docs/SCANNER_SQL_GUIDE.md
            docs/DEMO_BUY_VALIDATION.md docs/DEMO_BUY_PROTOCOL_LIMITS.md
            docs/DEMO_BUY_UX.md docs/AI_INVESTIGATION_PACK.md
            docs/IBKR_ORDER_SERVICE.md docs/IBKR_ORDER_SERVICE_SECURITY.md docs/MARKET_REPLAY.md
          )

          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing/empty required file: $file"; exit 1; }
          done

          for obsolete in \
            .planning/MASTER_COVERAGE.md \
            .planning/COVERAGE_MAP.yaml \
            .planning/LEGACY_COMPLETENESS_AUDIT.md; do
            test ! -e "$obsolete" || {
              echo "Superseded MarketScope planning artifact still present: $obsolete"
              exit 1
            }
          done

          grep -Eq '^plan_state: (active|frozen)$' .planning/STATUS.yaml || {
            echo "Invalid/missing plan_state"; exit 1;
          }

          grep -Eq '^phase: (planning|implementation|release_ready|done)$' STATUS.yaml || {
            echo "Invalid/missing root phase"; exit 1;
          }

          grep -q '^root: "0"$' .planning/TREE.yaml || {
            echo "TREE root must be 0"; exit 1;
          }

          grep -Fq '    children: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]' .planning/TREE.yaml || {
            echo "TREE root must contain nine capability branches"; exit 1;
          }

          for node in \
            '"4.3.1"' '"4.3.2"' '"4.3.3"' '"4.4.1"' '"4.4.2"' '"4.5.1"' '"4.5.2"' \
            '"7.5"' '"8.1"' '"8.2"' '"8.3"' '"8.4"' \
            '"9.1"' '"9.2"' '"9.3"' '"9.4"' '"9.5"' '"7.4"'; do
            grep -Fq "  ${node}:" .planning/TREE.yaml || {
              echo "TREE missing required implementation leaf ${node}"; exit 1;
            }
          done

          require_text() {
            local needle="$1"
            local file="$2"
            grep -Fq "$needle" "$file" || {
              echo "Missing planning invariant in $file: $needle"
              exit 1
            }
          }

          require_text '# Market Flow US Product Requirements' docs/PRODUCT_REQUIREMENTS.md
          require_text '# Market Flow US Product Spec' docs/PRODUCT_SPEC.md
          require_text '# Market Flow US Data Contract' docs/DATA_CONTRACT.md
          require_text '# Market Flow US Technical Spec' docs/TECHNICAL_SPEC.md
          require_text '# Market Flow US Test Strategy' docs/TEST_STRATEGY.md
          require_text '# Demo Buy Strategy Validation' docs/DEMO_BUY_VALIDATION.md
          require_text '# Demo Buy Protocol / Export Bounds' docs/DEMO_BUY_PROTOCOL_LIMITS.md
          require_text '# Demo Buy / AI Investigation UX Contract' docs/DEMO_BUY_UX.md
          require_text '# AI Investigation Pack' docs/AI_INVESTIGATION_PACK.md
          require_text '# Market Flow US — IBKR Order Service Contract' docs/IBKR_ORDER_SERVICE.md
          require_text '# Market Flow US — IBKR Order Service Local Security Contract' docs/IBKR_ORDER_SERVICE_SECURITY.md
          require_text '# Market Recording + Replay Contract' docs/MARKET_REPLAY.md

          require_text 'ScreenerHulPaging3' docs/DATA_CONTRACT.md
          require_text 'schema v4' docs/TECHNICAL_SPEC.md
          require_text 'demo.buy.capture' docs/TECHNICAL_SPEC.md
          require_text 'demo.buy.page' docs/TECHNICAL_SPEC.md
          require_text 'demo.buy.observation.get' docs/TECHNICAL_SPEC.md
          require_text 'demo.buy.capture.get' docs/TECHNICAL_SPEC.md
          require_text 'demo.buy.ai-pack.create' docs/TECHNICAL_SPEC.md
          require_text 'cycle_id > buy_cycle_id' docs/TECHNICAL_SPEC.md
          require_text 'cycle_id > buy_cycle_id' docs/DATA_CONTRACT.md
          require_text 'Replay time projection' docs/DATA_CONTRACT.md
          require_text 'server is replay-unaware' .planning/MARKET_REPLAY_MINI_PROJECT.md
          require_text 'No replay mode' docs/MARKET_REPLAY.md
          require_text '256 KiB' docs/DEMO_BUY_PROTOCOL_LIMITS.md
          require_text 'retained columns <= 64' docs/DEMO_BUY_PROTOCOL_LIMITS.md
          require_text 'Refresh observation' docs/DEMO_BUY_UX.md
          require_text 'Auto Demo Buy:' docs/DEMO_BUY_UX.md
          require_text 'ACKNOWLEDGEMENT_UNKNOWN' docs/DEMO_BUY_PROTOCOL_LIMITS.md
          require_text 'targetInScannerContext' docs/AI_INVESTIGATION_PACK.md
          require_text 'returned row position' docs/AI_INVESTIGATION_PACK.md
          require_text 'sharing-safe export projection' docs/DATA_CONTRACT.md
          require_text 'redactedForSharing' docs/AI_INVESTIGATION_PACK.md
          require_text 'redactedForSharing' docs/TECHNICAL_SPEC.md
          require_text 'canary secret/session' docs/TEST_STRATEGY.md
          require_text 'D-US-032' .planning/DECISIONS.md
          require_text 'D-US-033' .planning/DECISIONS.md
          require_text 'D-US-034' .planning/DECISIONS.md
          require_text 'D-US-036' .planning/DECISIONS.md
          require_text 'D-US-037' .planning/DECISIONS.md
          require_text 'D-US-039' .planning/DECISIONS.md
          require_text 'D-US-040' .planning/DECISIONS.md
          require_text 'D-US-045' .planning/DECISIONS.md
          require_text 'DRY_RUN' docs/IBKR_ORDER_SERVICE.md
          require_text 'ACKNOWLEDGEMENT_UNKNOWN' docs/IBKR_ORDER_SERVICE.md
          require_text '127.0.0.1:8770' docs/IBKR_ORDER_SERVICE_SECURITY.md
          require_text 'BROWSER_ORIGIN_REJECTED' docs/IBKR_ORDER_SERVICE_SECURITY.md
          require_text 'PENDING_EXTERNAL_PERMISSION' docs/IBKR_ORDER_SERVICE.md
          require_text 'same requestId + same normalized intent' docs/IBKR_ORDER_SERVICE.md
          require_text 'no short opening' docs/PRODUCT_REQUIREMENTS.md
          require_text '37 implementation leaves allocated exactly once' docs/TEST_STRATEGY.md
          require_text '8.1 / 8.2 / 8.3 / 8.4 done' docs/TEST_STRATEGY.md
          require_text '9.1 / 9.2 / 9.3 / 9.4 / 9.5 done' docs/TEST_STRATEGY.md
          require_text 'R-US-DEMO-BUY-FINAL' .planning/REVIEWS.md
          require_text 'R-US-DEMO-BUY-EXTERNAL' .planning/REVIEWS.md
          require_text 'R-US-IBKR-ORDER-FINAL' .planning/IBKR_ORDER_REVIEWS.md
          require_text 'R-US-IBKR-ORDER-EXTERNAL' .planning/IBKR_ORDER_REVIEWS.md

          require_text 'sharing-safe local AI Investigation Pack' .planning/TREE.yaml
          require_text 'fresh replay DB/session' .planning/TREE.yaml
          require_text '4096' docs/TEST_STRATEGY.md
          require_text '180 end-to-end cycles' docs/TEST_STRATEGY.md
          require_text 'at least 20 consecutive complete ScreenerHulPaging3 responses' docs/TEST_STRATEGY.md
          require_text 'stage_reached' docs/SCANNER_SQL_GUIDE.md

          if grep -Eq 'LastKnownRate|BaseRateChangePercentage|BuyLimit1|SellLimit1|DailyNISRevenue|DailyDealsQuantity|LastDealTimeOnly' \
            docs/PRODUCT_REQUIREMENTS.md docs/PRODUCT_SPEC.md docs/DATA_CONTRACT.md docs/TECHNICAL_SPEC.md docs/TEST_STRATEGY.md; then
            echo "Core U.S. planning contracts still contain Israeli typed market fields"
            exit 1
          fi

          if grep -Eq 'universe = 561|561 x 600|561 × 600' docs/TEST_STRATEGY.md docs/TECHNICAL_SPEC.md; then
            echo "Core U.S. verification contracts still contain old representative workload"
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');

          const tree = fs.readFileSync('.planning/TREE.yaml', 'utf8');
          const ids = [...tree.matchAll(/^  "([^"]+)":$/gm)].map(m => m[1]);
          if (!ids.length || ids[0] !== '0') throw new Error('TREE has no valid node list/root');

          const sections = {};
          for (let i = 0; i < ids.length; i++) {
            const start = tree.indexOf(`  "${ids[i]}":\n`);
            const end = i + 1 < ids.length
              ? tree.indexOf(`  "${ids[i + 1]}":\n`, start + 1)
              : tree.length;
            sections[ids[i]] = tree.slice(start, end);
          }

          const children = {};
          const deps = {};
          const parentCount = Object.fromEntries(ids.map(id => [id, 0]));

          for (const id of ids) {
            const childMatch = sections[id].match(/    children: \[([^\]]*)\]/);
            children[id] = childMatch && childMatch[1].trim()
              ? childMatch[1].split(',').map(x => x.trim().replace(/^"|"$/g, ''))
              : [];

            for (const child of children[id]) {
              if (!(child in parentCount)) throw new Error(`Missing TREE child ${child} referenced by ${id}`);
              parentCount[child]++;
            }

            const depMatch = sections[id].match(/    depends_on: \[([^\]]*)\]/);
            deps[id] = depMatch && depMatch[1].trim()
              ? depMatch[1].split(',').map(x => x.trim().replace(/^"|"$/g, ''))
              : [];
          }

          if (parentCount['0'] !== 0) throw new Error('Root cannot have a parent');
          for (const id of ids.filter(x => x !== '0')) {
            if (parentCount[id] !== 1) throw new Error(`Node ${id} must have exactly one S&T parent`);
          }

          const oneChild = ids.filter(id => children[id].length === 1);
          if (oneChild.length) throw new Error(`One-child S&T decomposition found: ${oneChild.join(', ')}`);

          const leaves = ids.filter(id => children[id].length === 0);
          const leafSet = new Set(leaves);

          for (const [id, list] of Object.entries(deps)) {
            for (const dep of list) {
              if (dep === id) throw new Error(`Self dependency: ${id}`);
              if (!leafSet.has(dep)) throw new Error(`Dependency ${id} -> ${dep} must reference an implementation leaf`);
            }
          }

          const visiting = new Set();
          const done = new Set();
          function visit(id) {
            if (visiting.has(id)) throw new Error(`Dependency cycle at ${id}`);
            if (done.has(id)) return;
            visiting.add(id);
            for (const dep of deps[id] || []) visit(dep);
            visiting.delete(id);
            done.add(id);
          }
          for (const leaf of leaves) visit(leaf);

          if (ids.length !== 50) throw new Error(`Expected 50 TREE nodes after Market Replay replan, found ${ids.length}`);
          if (leaves.length !== 37) throw new Error(`Expected 37 implementation leaves after Market Replay replan, found ${leaves.length}`);

          const planState = fs.readFileSync('.planning/STATUS.yaml', 'utf8')
            .match(/^plan_state: ([a-z_]+)$/m)?.[1];

          if (planState === 'frozen') {
            const statuses = [...tree.matchAll(/^    status: ([a-z_]+)$/gm)].map(m => m[1]);
            if (statuses.length !== ids.length || statuses.some(s => s !== 'approved')) {
              throw new Error('Frozen TREE must contain only approved nodes');
            }
            const reviews = fs.readFileSync('.planning/REVIEWS.md', 'utf8');
            const ibkrReviews = fs.readFileSync('.planning/IBKR_ORDER_REVIEWS.md', 'utf8');
            for (const marker of ['R-US-DEMO-BUY-FINAL', 'R-US-DEMO-BUY-EXTERNAL']) {
              if (!reviews.includes(marker)) throw new Error(`Frozen plan requires historical review ${marker}`);
            }
            for (const marker of ['R-US-IBKR-ORDER-FINAL', 'R-US-IBKR-ORDER-EXTERNAL']) {
              if (!ibkrReviews.includes(marker)) throw new Error(`Frozen plan requires branch-8 review ${marker}`);
            }
            for (const marker of ['R-US-MARKET-REPLAY-FINAL', 'R-US-MARKET-REPLAY-EXTERNAL']) {
              if (!reviews.includes(marker)) throw new Error(`Frozen plan requires branch-9 review ${marker}`);
            }
          }

          console.log('TREE verified', { nodes: ids.length, leaves: leaves.length });
          NODE

          plan_state="$(sed -n 's/^plan_state: //p' .planning/STATUS.yaml | head -n1)"
          replan_mode="$(sed -n 's/^replan_mode: //p' .planning/STATUS.yaml | head -n1)"
          phase="$(sed -n 's/^phase: //p' STATUS.yaml | head -n1)"

          if [ "$plan_state" = "active" ]; then
            [ "$phase" = "planning" ] || {
              echo "Active plan requires root phase: planning"
              exit 1
            }
            if [ "$replan_mode" = "execution_reopen" ]; then
              ! grep -q '^chats: {}$' .planning/EXECUTION.yaml || {
                echo "execution_reopen requires preserved allocated EXECUTION"
                exit 1
              }
            else
              grep -q '^chats: {}$' .planning/EXECUTION.yaml || {
                echo "Initial active planning must keep EXECUTION unallocated"
                exit 1
              }
            fi
          fi

          if [ "$phase" = "implementation" ]; then
            [ "$plan_state" = "frozen" ] || {
              echo "Implementation requires frozen plan"
              exit 1
            }
            ! grep -q '^chats: {}$' .planning/EXECUTION.yaml || {
              echo "Implementation requires allocated EXECUTION"
              exit 1
            }
          fi

          node .planning/verify-handoff.mjs

          echo "Market Flow US planning validation passed."
