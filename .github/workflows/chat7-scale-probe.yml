name: Chat 7 Scale Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/chat7-scale-probe.yml"
      - "tests/workload/**"
      - "local-service/**"
      - "shared/scanner/**"

permissions:
  contents: read

concurrency:
  group: chat7-scale-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scale-probe:
    name: 4096 x 10 commit diagnostic probe
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run commit diagnostic probe
        env:
          MARKET_FLOW_US_WORKLOAD_REPORT: test-results/workload/scale-probe-4096x10.json
        shell: bash
        run: |
          sed -i 's/const CYCLE_COUNT = 180;/const CYCLE_COUNT = 10;/' tests/workload/representative-workload.test.mjs
          sed -i 's/const READ_INTERVAL_CYCLES = 60;/const READ_INTERVAL_CYCLES = 10;/' tests/workload/representative-workload.test.mjs
          sed -i 's/includeStaged: cycleNumber === CYCLE_COUNT/includeStaged: false/' tests/workload/representative-workload.test.mjs
          sed -i 's/includeStaged: true/includeStaged: false/' tests/workload/representative-workload.test.mjs
          npm run test:workload

      - name: Print sanitized scale report
        if: always()
        shell: bash
        run: |
          if [[ -f test-results/workload/scale-probe-4096x10.json ]]; then
            cat test-results/workload/scale-probe-4096x10.json
          else
            echo "Scale probe report was not produced."
          fi

      - name: Upload sanitized scale report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-flow-us-scale-probe-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: test-results/workload/scale-probe-4096x10.json
